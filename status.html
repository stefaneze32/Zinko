/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
  "https://ggqhwoyzuypryocrxiru.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_RIB0a5lVDxK8iqvTB1lr8A_JLnaMvF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =================================
   ELEMENTS
================================= */

const statusText =
  document.getElementById("statusText");

const mentionInput =
  document.getElementById("mentionInput");

const highlightInput =
  document.getElementById("highlightInput");

const mediaInput =
  document.getElementById("mediaInput");

const voiceInput =
  document.getElementById("voiceInput");

const mediaPreview =
  document.getElementById("mediaPreview");

const voicePreview =
  document.getElementById("voicePreview");

const audience =
  document.getElementById("audience");

const publishButton =
  document.getElementById("publishButton");

const clearButton =
  document.getElementById("clearButton");

const statusMessage =
  document.getElementById("statusMessage");

const statusList =
  document.getElementById("statusList");


let selectedMedia = null;
let selectedVoice = null;
let currentUser = null;


/* =================================
   CURRENT USER
================================= */

async function loadCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();

  if (error) {

    console.error(error);

    currentUser = null;

    return null;

  }

  currentUser =
    data && data.user
      ? data.user
      : null;

  return currentUser;

}


/* =================================
   MEDIA PREVIEW
================================= */

mediaInput.addEventListener(
  "change",
  () => {

    const file =
      mediaInput.files[0];

    mediaPreview.innerHTML = "";

    selectedMedia = null;

    if (!file) {
      return;
    }

    selectedMedia = file;

    const url =
      URL.createObjectURL(file);

    if (
      file.type.startsWith("video/")
    ) {

      mediaPreview.innerHTML = `

        <video
          src="${escapeAttribute(url)}"
          controls
          playsinline
        ></video>

      `;

    } else {

      mediaPreview.innerHTML = `

        <img
          src="${escapeAttribute(url)}"
          alt="Status preview"
        >

      `;

    }

  }
);


/* =================================
   VOICE PREVIEW
================================= */

voiceInput.addEventListener(
  "change",
  () => {

    const file =
      voiceInput.files[0];

    voicePreview.innerHTML = "";

    selectedVoice = null;

    if (!file) {
      return;
    }

    selectedVoice = file;

    const url =
      URL.createObjectURL(file);

    voicePreview.innerHTML = `

      <audio
        class="voice-player"
        src="${escapeAttribute(url)}"
        controls
      ></audio>

    `;

  }
);


/* =================================
   CLEAR
================================= */

clearButton.addEventListener(
  "click",
  () => {

    statusText.value = "";

    mentionInput.value = "";

    highlightInput.value = "";

    mediaInput.value = "";

    voiceInput.value = "";

    mediaPreview.innerHTML = "";

    voicePreview.innerHTML = "";

    selectedMedia = null;

    selectedVoice = null;

    statusMessage.textContent = "";

  }
);


/* =================================
   PUBLISH STATUS
================================= */

publishButton.addEventListener(
  "click",
  async () => {

    statusMessage.textContent = "";

    await loadCurrentUser();

    if (!currentUser) {

      statusMessage.textContent =
        "Please log in before posting a status.";

      return;

    }


    const text =
      statusText.value.trim();

    const mention =
      mentionInput.value.trim();

    const highlight =
      highlightInput.value.trim();


    if (
      !text &&
      !selectedMedia &&
      !selectedVoice
    ) {

      statusMessage.textContent =
        "Add text, photo, video, or voice.";

      return;

    }


    publishButton.disabled = true;

    publishButton.textContent =
      "Posting...";


    try {

      let mediaURL = null;

      let voiceURL = null;

      let mediaType = null;


      /* =========================
         MEDIA UPLOAD
      ========================= */

      if (selectedMedia) {

        const extension =
          selectedMedia.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          `status/${currentUser.id}/${Date.now()}-media.${extension}`;


        const {
          error: uploadError
        } =
        await supabaseClient.storage
          .from("post-media")
          .upload(
            fileName,
            selectedMedia,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


        if (uploadError) {
          throw uploadError;
        }


        const {
          data
        } =
        supabaseClient.storage
          .from("post-media")
          .getPublicUrl(fileName);


        mediaURL =
          data.publicUrl;


        mediaType =
          selectedMedia.type.startsWith("video/")
            ? "video"
            : "image";

      }


      /* =========================
         VOICE UPLOAD
      ========================= */

      if (selectedVoice) {

        const extension =
          selectedVoice.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          `status/${currentUser.id}/${Date.now()}-voice.${extension}`;


        const {
          error: uploadError
        } =
        await supabaseClient.storage
          .from("post-media")
          .upload(
            fileName,
            selectedVoice,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


        if (uploadError) {
          throw uploadError;
        }


        const {
          data
        } =
        supabaseClient.storage
          .from("post-media")
          .getPublicUrl(fileName);


        voiceURL =
          data.publicUrl;

      }


      /* =========================
         INSERT STATUS
      ========================= */

      const {
        error: insertError
      } =
      await supabaseClient
        .from("statuses")
        .insert({

          user_id:
            currentUser.id,

          content:
            text || null,

          media_url:
            mediaURL,

          media_type:
            mediaType,

          voice_url:
            voiceURL,

          mention:
            mention || null,

          highlight:
            highlight || null,

          audience:
            audience.value,

          expires_at:
            new Date(
              Date.now() +
              24 * 60 * 60 * 1000
            ).toISOString()

        });


      if (insertError) {
        throw insertError;
      }


      statusMessage.textContent =
        "Status posted successfully! 🎉";


      clearButton.click();

      await loadStatuses();


    } catch (error) {

      console.error(error);

      statusMessage.textContent =
        error.message ||
        "Something went wrong while posting.";

    }


    publishButton.disabled = false;

    publishButton.textContent =
      "Post Status";

  }
);


/* =================================
   LOAD STATUSES
================================= */

async function loadStatuses() {

  statusList.innerHTML = `

    <div class="loading">
      Loading statuses...
    </div>

  `;


  await loadCurrentUser();


  const now =
    new Date().toISOString();


  const {
    data,
    error
  } =
  await supabaseClient
    .from("statuses")
    .select("*")
    .gt("expires_at", now)
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    statusList.innerHTML = `

      <div class="empty">
        Status is not ready yet.
      </div>

    `;

    return;

  }


  statusList.innerHTML = "";


  if (
    !data ||
    data.length === 0
  ) {

    statusList.innerHTML = `

      <div class="empty">
        No active statuses yet.
      </div>

    `;

    return;

  }


  data.forEach(
    status => {

      renderStatus(status);

    }
  );

}


/* =================================
   RENDER STATUS
================================= */

function renderStatus(status) {

  const card =
    document.createElement("article");

  card.className =
    "status-card";


  let mediaHTML = "";


  if (
    status.media_url &&
    status.media_type === "video"
  ) {

    mediaHTML = `

      <div class="status-media">

        <video
          src="${escapeAttribute(status.media_url)}"
          controls
          playsinline
        ></video>

      </div>

    `;

  } else if (
    status.media_url
  ) {

    mediaHTML = `

      <div class="status-media">

        <img
          src="${escapeAttribute(status.media_url)}"
          alt="Status"
        >

      </div>

    `;

  }


  let voiceHTML = "";


  if (status.voice_url) {

    voiceHTML = `

      <audio
        class="voice-player"
        src="${escapeAttribute(status.voice_url)}"
        controls
      ></audio>

    `;

  }


  const isOwner =
    currentUser &&
    status.user_id === currentUser.id;


  card.innerHTML = `

    <div class="status-head">

      <div class="avatar">
        Z
      </div>

      <div class="status-info">

        <b>Zinko User</b>

        <small>
          ${formatDate(status.created_at)}
        </small>

      </div>

    </div>


    ${
      status.content
        ? `
          <div class="status-content">
            ${highlightText(
              status.content,
              status.highlight
            )}
          </div>
        `
        : ""
    }


    ${
      status.mention
        ? `
          <div class="status-content">
            <b>Mention:</b>
            ${escapeHTML(status.mention)}
          </div>
        `
        : ""
    }


    ${mediaHTML}

    ${voiceHTML}


    <div class="status-actions">

      <button
        type="button"
        class="status-like"
        data-status-id="${escapeAttribute(status.id)}"
      >
        ♡ Like
      </button>

      <button
        type="button"
        class="status-reply"
      >
        💬 Reply
      </button>

      ${
        isOwner
          ? `
            <button
              type="button"
              class="status-viewers"
              data-status-id="${escapeAttribute(status.id)}"
            >
              👁 Viewers
            </button>

            <button
              type="button"
              class="status-delete"
              data-status-id="${escapeAttribute(status.id)}"
            >
              🗑 Delete
            </button>
          `
          : ""
      }

    </div>


    <div class="status-stats">
      24-hour status
    </div>


    <div class="reply-box">

      <div class="reply-form">

        <input
          class="reply-input"
          type="text"
          maxlength="1000"
          placeholder="Reply to this status..."
        >

        <button
          type="button"
          class="reply-send"
          data-status-id="${escapeAttribute(status.id)}"
        >
          Send
        </button>

      </div>


      <div class="reply-list">
        Loading replies...
      </div>

    </div>

  `;


  statusList.appendChild(card);


  loadReplies(
    status.id,
    card
  );

}


/* =================================
   LOAD REPLIES
================================= */

async function loadReplies(
  statusId,
  card
) {

  const list =
    card.querySelector(".reply-list");


  const {
    data,
    error
  } =
  await supabaseClient
    .from("status_replies")
    .select("*")
    .eq("status_id", statusId)
    .order(
      "created_at",
      {
        ascending: true
      }
    );


  if (error) {

    list.innerHTML =
      `<small>Replies will be available after setup.</small>`;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML =
      `<small>No replies yet.</small>`;

    return;

  }


  list.innerHTML = "";


  data.forEach(
    reply => {

      const item =
        document.createElement("div");

      item.className =
        "reply";


      item.innerHTML = `

        <b>Zinko User</b>

        <small>
          ${formatDate(reply.created_at)}
        </small>

        <div>
          ${escapeHTML(
            reply.content || ""
          )}
        </div>

      `;


      list.appendChild(item);

    }
  );

}


/* =================================
   CLICK EVENTS
================================= */

statusList.addEventListener(
  "click",
  async event => {

    const likeButton =
      event.target.closest(".status-like");


    if (likeButton) {

      await likeStatus(
        likeButton.dataset.statusId,
        likeButton
      );

      return;

    }


    const replyButton =
      event.target.closest(".reply-send");


    if (replyButton) {

      const card =
        replyButton.closest(".status-card");


      await addReply(
        replyButton.dataset.statusId,
        card
      );

      return;

    }


    const deleteButton =
      event.target.closest(".status-delete");


    if (deleteButton) {

      await deleteStatus(
        deleteButton.dataset.statusId
      );

      return;

    }


    const viewerButton =
      event.target.closest(".status-viewers");


    if (viewerButton) {

      alert(
        "Viewer tracking will be connected in the next Supabase step."
      );

      return;

    }

  }
);


/* =================================
   LIKE STATUS
================================= */

async function likeStatus(
  statusId,
  button
) {

  await loadCurrentUser();


  if (!currentUser) {

    alert(
      "Please log in to like a status."
    );

    return;

  }


  const {
    data: existing
  } =
  await supabaseClient
    .from("status_likes")
    .select("id")
    .eq(
      "status_id",
      statusId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();


  if (existing) {

    const {
      error
    } =
    await supabaseClient
      .from("status_likes")
      .delete()
      .eq(
        "id",
        existing.id
      );


    if (error) {

      alert(error.message);

      return;

    }


    button.classList.remove("liked");

    button.textContent =
      "♡ Like";

  } else {

    const {
      error
    } =
    await supabaseClient
      .from("status_likes")
      .insert({

        status_id:
          statusId,

        user_id:
          currentUser.id

      });


    if (error) {

      alert(error.message);

      return;

    }


    button.classList.add("liked");

    button.textContent =
      "♥ Liked";

  }

}


/* =================================
   ADD REPLY
================================= */

async function addReply(
  statusId,
  card
) {

  await loadCurrentUser();


  if (!currentUser) {

    alert(
      "Please log in before replying."
    );

    return;

  }


  const input =
    card.querySelector(".reply-input");


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("status_replies")
    .insert({

      status_id:
        statusId,

      user_id:
        currentUser.id,

      content:
        text

    });


  if (error) {

    alert(error.message);

    return;

  }


  input.value = "";


  await loadReplies(
    statusId,
    card
  );

}


/* =================================
   DELETE STATUS
================================= */

async function deleteStatus(
  statusId
) {

  await loadCurrentUser();


  if (!currentUser) {
    return;
  }


  if (
    !confirm(
      "Delete this status?"
    )
  ) {

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("statuses")
    .delete()
    .eq(
      "id",
      statusId
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if (error) {

    alert(error.message);

    return;

  }


  await loadStatuses();

}


/* =================================
   HIGHLIGHT TEXT
================================= */

function highlightText(
  text,
  highlight
) {

  const safeText =
    escapeHTML(text);


  if (!highlight) {
    return safeText;
  }


  const safeHighlight =
    escapeHTML(highlight);


  const regex =
    new RegExp(
      "(" +
      escapeRegExp(
        safeHighlight
      ) +
      ")",
      "gi"
    );


  return safeText.replace(
    regex,
    `<mark style="
      background:#ffd34d;
      color:#111;
      border-radius:4px;
      padding:1px 3px;
    ">$1</mark>`
  );

}


/* =================================
   ESCAPE REGEX
================================= */

function escapeRegExp(
  text
) {

  return text.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(
  text
) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* =================================
   ESCAPE ATTRIBUTE
================================= */

function escapeAttribute(
  text
) {

  return String(
    text || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


/* =================================
   DATE
================================= */

function formatDate(
  value
) {

  if (!value) {
    return "";
  }

  return new Date(
    value
  ).toLocaleString();

}
