<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zinko Home</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="app">

<header class="top">
  <div class="wordmark"><span>Z</span>Zinko</div>

  <div class="top-actions">
    <button type="button">⌕</button>
    <button type="button">♡</button>
    <button type="button">✉</button>
  </div>
</header>


<div class="stories">
  <div class="story add">＋<small>Your status</small></div>
  <div class="story">M<small>Maya</small></div>
  <div class="story">J<small>Jay</small></div>
  <div class="story">A<small>Ada</small></div>
  <div class="story">K<small>Kofi</small></div>
</div>


<main class="feed">

<!-- CREATE POST -->

<section class="post">

  <div class="post-head">
    <div class="avatar" id="myAvatar">S</div>

    <div>
      <b id="myName">Create a post</b>
      <small>Share something with Zinko</small>
    </div>
  </div>

  <textarea
    id="postText"
    placeholder="What's happening?"
    rows="4"
    style="width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid #ddd;resize:none;"
  ></textarea>

  <div style="margin-top:12px;">

    <label
      for="photoInput"
      class="btn glass"
      style="display:inline-block;cursor:pointer;"
    >
      📷 Add Photo
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      style="display:none;"
    >

  </div>

  <div id="photoPreview" style="margin-top:12px;"></div>

  <button
    id="postButton"
    class="btn primary full"
    type="button"
    style="margin-top:12px;"
  >
    Post
  </button>

  <p
    id="postMessage"
    class="center muted"
    style="margin-top:8px;"
  ></p>

</section>


<!-- POSTS -->

<div id="postsContainer"></div>


</main>


<nav class="nav">

  <a class="active" href="home.html">
    ⌂
    <small>Home</small>
  </a>

  <a href="live.html">
    ◉
    <small>Live</small>
  </a>

  <a href="discover.html">
    ⌕
    <small>Discover</small>
  </a>

  <a href="messages.html">
    ✉
    <small>Messages</small>
  </a>

  <a href="profile.html">
    ●
    <small>Profile</small>
  </a>

</nav>

</div>


<script>

const SUPABASE_URL =
  "https://ggqhwoyzuypryocrxiru.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_RIB0a5lVDxK8iqvTB1lr8A_JLnaMvF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const postText =
  document.getElementById("postText");

const photoInput =
  document.getElementById("photoInput");

const photoPreview =
  document.getElementById("photoPreview");

const postButton =
  document.getElementById("postButton");

const postMessage =
  document.getElementById("postMessage");

const postsContainer =
  document.getElementById("postsContainer");


let selectedPhoto = null;


/* PHOTO PREVIEW */

photoInput.addEventListener("change", () => {

  const file = photoInput.files[0];

  if (!file) {
    selectedPhoto = null;
    photoPreview.innerHTML = "";
    return;
  }

  selectedPhoto = file;

  const imageURL =
    URL.createObjectURL(file);

  photoPreview.innerHTML = `
    <img
      src="${imageURL}"
      alt="Selected photo"
      style="
        width:100%;
        max-height:400px;
        object-fit:cover;
        border-radius:14px;
      "
    >
  `;

});


/* LOAD POSTS */

async function loadPosts() {

  const { data, error } =
    await supabaseClient
      .from("posts")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    postsContainer.innerHTML =
      "<p>Unable to load posts.</p>";

    return;
  }


  postsContainer.innerHTML = "";


  data.forEach(post => {

    const article =
      document.createElement("article");

    article.className = "post";


    let photoHTML = "";

    if (post.image_url) {

      photoHTML = `
        <img
          src="${post.image_url}"
          alt="Zinko post"
          style="
            width:100%;
            border-radius:14px;
            margin-top:12px;
            max-height:500px;
            object-fit:cover;
          "
        >
      `;

    }


    article.innerHTML = `

      <div class="post-head">

        <div class="avatar">
          Z
        </div>

        <div>
          <b>Zinko User</b>
          <small>
            Just now
          </small>
        </div>

      </div>

      ${
        post.content
          ? `<p>${escapeHTML(post.content)}</p>`
          : ""
      }

      ${photoHTML}

      <div class="engage">

        <button type="button">
          ♡
        </button>

        <button type="button">
          💬
        </button>

        <button type="button">
          ↗
        </button>

        <button type="button">
          🔖
        </button>

      </div>

    `;


    postsContainer.appendChild(article);

  });

}


/* CREATE POST */

postButton.addEventListener("click", async () => {

  const text =
    postText.value.trim();


  if (!text && !selectedPhoto) {

    postMessage.textContent =
      "Write something or add a photo.";

    return;

  }


  postButton.disabled = true;

  postButton.textContent =
    "Posting...";


  try {

    const {
      data: userData,
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError || !userData.user) {

      throw new Error(
        "Please log in before creating a post."
      );

    }


    const user =
      userData.user;


    let imageURL = null;


    /* UPLOAD PHOTO */

    if (selectedPhoto) {

      const fileExtension =
        selectedPhoto.name
          .split(".")
          .pop();


      const fileName =
        `${user.id}/${Date.now()}.${fileExtension}`;


      const {
        error: uploadError
      } =
        await supabaseClient.storage
          .from("post-media")
          .upload(
            fileName,
            selectedPhoto,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


      if (uploadError) {

        throw uploadError;

      }


      const {
        data: publicURLData
      } =
        supabaseClient.storage
          .from("post-media")
          .getPublicUrl(fileName);


      imageURL =
        publicURLData.publicUrl;

    }


    /* SAVE POST */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("posts")
        .insert({

          user_id: user.id,

          content: text,

          image_url: imageURL

        });


    if (insertError) {

      throw insertError;

    }


    postText.value = "";

    photoInput.value = "";

    selectedPhoto = null;

    photoPreview.innerHTML = "";

    postMessage.textContent =
      "Posted successfully! 🎉";


    await loadPosts();


  } catch (error) {

    console.error(error);

    postMessage.textContent =
      error.message;

  }


  postButton.disabled = false;

  postButton.textContent =
    "Post";

});


/* ESCAPE HTML */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* START */

loadPosts();

</script>

</body>
</html>
