<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zinko Home</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d1c;
      color: #f5f7ff;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding-bottom: 80px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #1b102c;
      border-bottom: 1px solid #27213d;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .wordmark {
      font-size: 24px;
      font-weight: 800;
    }

    .wordmark span {
      display: inline-flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #5865f2, #20c7df);
      color: white;
      margin-right: 6px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .top-actions button {
      border: 0;
      background: transparent;
      color: white;
      font-size: 22px;
      cursor: pointer;
      width: 38px;
      height: 38px;
      border-radius: 10px;
    }

    .top-actions button:active {
      background: rgba(255,255,255,.10);
      transform: scale(.95);
    }

    /* ================================
       NOTIFICATION PANEL
    ================================ */

    .notification-panel {
      position: fixed;
      top: 72px;
      right: 14px;
      width: min(360px, calc(100% - 28px));
      background: #101728;
      border: 1px solid #29314b;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,.45);
      z-index: 100;
      display: none;
    }

    .notification-panel.show {
      display: block;
    }

    .notification-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .notification-header h3 {
      margin: 0;
      font-size: 18px;
    }

    .notification-close {
      border: 0;
      background: transparent;
      color: #aeb5cb;
      font-size: 20px;
      cursor: pointer;
    }

    .notification-empty {
      text-align: center;
      padding: 25px 10px;
      color: #858da6;
      line-height: 1.5;
    }

    .stories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 14px 16px;
      background: #0c1222;
      min-height: 100px;
    }

    .story {
      min-width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5865f2, #c33edc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      position: relative;
      color: white;
      flex-shrink: 0;
      text-decoration: none;
    }

    .story small {
      position: absolute;
      top: 66px;
      font-size: 10px;
      white-space: nowrap;
      font-weight: normal;
      color: #aab0c7;
    }

    .story.add {
      background: #211633;
      font-size: 26px;
    }

    .feed {
      padding: 14px;
    }

    .post {
      background: #101728;
      border: 1px solid #202840;
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }

    .post-head {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .post-head small {
      display: block;
      color: #aeb5cb;
      margin-top: 3px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5865f2, #20c7df);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    textarea {
      font-family: inherit;
      color: white;
      background: #0b1120;
      border: 1px solid #29314b !important;
    }

    textarea::placeholder {
      color: #858da6;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 11px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg, #7155ff, #10bce4);
      color: white;
    }

    .glass {
      background: #211633;
      color: white;
      border: 1px solid #3b3155;
    }

    .full {
      width: 100%;
    }

    .engage {
      display: flex;
      gap: 18px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #252d43;
      align-items: center;
      flex-wrap: wrap;
    }

    .engage button {
      border: 0;
      background: transparent;
      color: #dce1f2;
      font-size: 18px;
      cursor: pointer;
      padding: 5px;
    }

    .like-button.liked {
      color: #ff4d91;
      font-weight: bold;
    }

    .save-button.saved {
      color: #ffd34d;
    }

    .viewer-count {
      color: #aeb5cb;
      font-size: 14px;
      margin-left: auto;
      white-space: nowrap;
    }

    .muted {
      color: #aeb5cb;
    }

    .center {
      text-align: center;
    }

    .media-preview {
      width: 100%;
      max-height: 500px;
      margin-top: 12px;
      border-radius: 16px;
      object-fit: cover;
      background: #000;
    }

    .comments-section {
      margin-top: 14px;
      border-top: 1px solid #252d43;
      padding-top: 12px;
    }

    .comment {
      background: #0b1120;
      border: 1px solid #202840;
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
    }

    .comment-head {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .comment-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5865f2, #20c7df);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .comment-info {
      flex: 1;
      min-width: 0;
    }

    .comment-text {
      margin: 7px 0 0 38px;
      word-break: break-word;
    }

    .comment-delete {
      border: 0;
      background: transparent;
      color: #ff6b81;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      padding: 5px;
    }

    .comment-delete:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .comment-input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #29314b;
      background: #0b1120;
      color: white;
      outline: none;
    }

    .comment-input::placeholder {
      color: #858da6;
    }

    .comment-send {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      background: #7155ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .comment-message {
      font-size: 12px;
      margin-top: 6px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 700px;
      margin: auto;
      height: 64px;
      background: #0a1020;
      border-top: 1px solid #202840;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .nav a {
      text-decoration: none;
      color: #69718a;
      text-align: center;
      font-size: 20px;
    }

    .nav a.active {
      color: #f5f7ff;
      font-weight: bold;
    }

    .nav small {
      display: block;
      font-size: 10px;
      margin-top: 3px;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #858da6;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #aeb5cb;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="top">

    <div class="wordmark">
      <span>Z</span>Zinko
    </div>

    <div class="top-actions">

      <button
        type="button"
        id="searchTopButton"
        aria-label="Search"
      >
        ⌕
      </button>

      <button
        type="button"
        id="notificationTopButton"
        aria-label="Notifications"
      >
        ♡
      </button>

      <button
        type="button"
        id="messageTopButton"
        aria-label="Messages"
      >
        ✉
      </button>

    </div>

  </header>


  <!-- NOTIFICATIONS PANEL -->

  <div
    id="notificationPanel"
    class="notification-panel"
  >

    <div class="notification-header">

      <h3>Notifications</h3>

      <button
        type="button"
        id="closeNotificationButton"

        aria-label="Close notifications"
      >
        ✕
      </button>

    </div>

    <div class="notification-empty">
      🔔<br><br>

  <div class="stories">

    <a
      href="status.html"
      class="story add"

      <small>Your status</small>

    <div class="story">
      M

    </div>

    <div class="story">
      J
      <small>Jay</small>
    </div>

    <div class="story">
      A
      <small>Ada</small>
    </div>

    <div class="story">
      K
      <small>Kofi</small>
    </div>

  </div>


  <main class="feed">

    <!-- CREATE POST -->

    <section class="post">

      <div class="post-head">

        <div class="avatar">

        </div>

        <div>

      <div style="

        >

      <div

</div>


<script>

const SUPABASE_URL =
  "https://ggqhwoyzuypryocrxiru.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_RIB0a5lVDxK8iqvTB1lr8A_JLnaMvF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const postText =
  document.getElementById("postText");

const photoInput =
  document.getElementById("photoInput");

const videoInput =
  document.getElementById("videoInput");

const mediaPreview =
  document.getElementById("mediaPreview");

const postButton =
  document.getElementById("postButton");

const postMessage =
  document.getElementById("postMessage");

const postsContainer =
  document.getElementById("postsContainer");


const searchTopButton =
  document.getElementById("searchTopButton");

const notificationTopButton =
  document.getElementById("notificationTopButton");

const messageTopButton =
  document.getElementById("messageTopButton");

const notificationPanel =
  document.getElementById("notificationPanel");

const closeNotificationButton =
  document.getElementById("closeNotificationButton");


let selectedPhoto = null;
let selectedVideo = null;
let currentUser = null;


/* ================================
   TOP ICONS
================================ */

if (searchTopButton) {

  searchTopButton.addEventListener(
    "click",
    () => {

      window.location.href =
        "discover.html";

    }
  );

}


if (messageTopButton) {

  messageTopButton.addEventListener(
    "click",
    () => {

      window.location.href =
        "messages.html";

    }
  );

}


if (notificationTopButton) {

  notificationTopButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      notificationPanel.classList.toggle(
        "show"
      );

    }
  );

}


if (closeNotificationButton) {

  closeNotificationButton.addEventListener(
    "click",
    () => {

      notificationPanel.classList.remove(
        "show"
      );

    }
  );

}


document.addEventListener(
  "click",
  event => {

    if (
      notificationPanel &&
      notificationPanel.classList.contains("show") &&
      !notificationPanel.contains(event.target) &&
      !notificationTopButton.contains(event.target)
    ) {

      notificationPanel.classList.remove(
        "show"
      );

    }

  }
);


/* ================================
   CURRENT USER
================================ */

async function loadCurrentUser() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if (error) {

    console.error(error);

    currentUser = null;

    return null;

  }


  currentUser =
    data && data.user
      ? data.user
      : null;


  return currentUser;

}


/* ================================
   MEDIA PREVIEW
================================ */

function updateMediaPreview() {

  mediaPreview.innerHTML = "";


  if (selectedPhoto) {

    const imageURL =
      URL.createObjectURL(selectedPhoto);


    mediaPreview.innerHTML = `

      <img
        src="${imageURL}"
        alt="Selected photo"
        class="media-preview"
      >

    `;

    return;

  }


  if (selectedVideo) {

    const videoURL =
      URL.createObjectURL(selectedVideo);


    mediaPreview.innerHTML = `

      <video
        src="${videoURL}"
        class="media-preview"
        controls
        playsinline
      ></video>

    `;

  }

}


/* ================================
   PHOTO SELECT
================================ */

photoInput.addEventListener(
  "change",
  () => {

    const file =
      photoInput.files[0];


    if (!file) {

      selectedPhoto = null;

      updateMediaPreview();

      return;

    }


    selectedPhoto = file;

    selectedVideo = null;

    videoInput.value = "";


    updateMediaPreview();

  }
);


/* ================================
   VIDEO SELECT
================================ */

videoInput.addEventListener(
  "change",
  () => {

    const file =
      videoInput.files[0];


    if (!file) {

      selectedVideo = null;

      updateMediaPreview();

      return;

    }


    selectedVideo = file;

    selectedPhoto = null;

    photoInput.value = "";


    updateMediaPreview();

  }
);


/* ================================
   RECORD POST VIEW
================================ */

async function recordPostView(postId) {

  if (!currentUser || !postId) {

    return;

  }


  try {

    const {
      error
    } =
    await supabaseClient
      .from("post_viewers")
      .upsert(
        {
          post_id: postId,
          user_id: currentUser.id
        },
        {
          onConflict:
            "post_id,user_id",
          ignoreDuplicates:
            true
        }
      );


    if (error) {

      console.log(
        "Viewer tracking:",
        error.message
      );

    }

  } catch (error) {

    console.log(
      "Viewer tracking unavailable."
    );

  }

}


/* ================================
   LOAD VIEWER COUNT
================================ */

async function getViewerCount(postId) {

  const {
    count,
    error
  } =
  await supabaseClient
    .from("post_viewers")
    .select(
      "*",
      {
        count: "exact",
        head: true
      }
    )
    .eq(
      "post_id",
      postId
    );


  if (error) {

    console.log(
      "Viewer count:",
      error.message
    );

    return 0;

  }


  return count || 0;

}


/* ================================
   LOAD POSTS
================================ */

async function loadPosts() {

  postsContainer.innerHTML = `

    <div class="loading">
      Loading Zinko posts...
    </div>

  `;


  await loadCurrentUser();


  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);


    postsContainer.innerHTML = `

      <div class="empty">
        Unable to load posts.
      </div>

    `;

    return;

  }


  postsContainer.innerHTML = "";


  if (!data || data.length === 0) {

    postsContainer.innerHTML = `

      <div class="empty">
        No posts yet. Be the first to post!
      </div>

    `;

    return;

  }


  for (const post of data) {

    await renderPost(post);

  }


  await updateLikeStates();

}


/* ================================
   RENDER POST
================================ */

async function renderPost(post) {

  const article =
    document.createElement("article");


  article.className =
    "post";


  await recordPostView(
    post.id
  );


  const {
    count: likeCount
  } =
  await supabaseClient
    .from("post_likes")
    .select(
      "*",
      {
        count: "exact",
        head: true
      }
    )
    .eq(
      "post_id",
      post.id
    );


  const viewerCount =
    await getViewerCount(
      post.id
    );


  let mediaHTML = "";


  if (post.image_url) {

    mediaHTML = `

      <img
        src="${escapeAttribute(post.image_url)}"
        alt="Zinko post"
        class="media-preview"
      >

    `;

  }


  if (post.video_url) {

    mediaHTML = `

      <video
        src="${escapeAttribute(post.video_url)}"
        class="media-preview"
        controls
        playsinline
        preload="metadata"
      ></video>

    `;

  }


  article.innerHTML = `

    <div class="post-head">

      <div class="avatar">
        Z
      </div>

      <div>

        <b>Zinko User</b>

        <small>
          ${formatDate(post.created_at)}
        </small>

      </div>

    </div>


    ${
      post.content
        ? `<p>${escapeHTML(post.content)}</p>`
        : ""
    }


    ${mediaHTML}


    <div class="engage">

      <button
        type="button"
        class="like-button"
        data-post-id="${escapeAttribute(post.id)}"
      >
        ♡
        <span class="like-count">
          ${likeCount || 0}
        </span>
      </button>


      <button
        type="button"
        class="comment-toggle"
        data-post-id="${escapeAttribute(post.id)}"
      >
        💬
      </button>


      <button
        type="button"
        class="share-button"
        data-post-id="${escapeAttribute(post.id)}"
      >
        ↗
      </button>


      <button
        type="button"
        class="save-button"
        data-post-id="${escapeAttribute(post.id)}"
      >
        🔖
      </button>


      <span class="viewer-count">
        👁 ${viewerCount}
      </span>

    </div>


    <div
      class="comments-section"
      id="comments-${escapeAttribute(post.id)}"
    >

      <b>Comments</b>


      <div class="comments-list">
        Loading comments...
      </div>


      <div class="comment-form">

        <input
          type="text"
          class="comment-input"
          placeholder="Write a comment..."
          maxlength="1000"
        >


        <button
          type="button"
          class="comment-send"
          data-post-id="${escapeAttribute(post.id)}"
        >
          Send
        </button>

      </div>


      <div class="comment-message muted"></div>

    </div>

  `;


  postsContainer.appendChild(article);


  await loadComments(
    post,
    article
  );

}


/* ================================
   LOAD COMMENTS
================================ */

async function loadComments(
  post,
  article
) {

  const commentsList =
    article.querySelector(
      ".comments-list"
    );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("comments")
    .select("*")
    .eq(
      "post_id",
      post.id
    )
    .order(
      "created_at",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);


    commentsList.innerHTML =
      `<div class="muted">Unable to load comments.</div>`;


    return;

  }


  if (!data || data.length === 0) {

    commentsList.innerHTML =
      `<div class="muted" style="margin-top:8px;">No comments yet.</div>`;


    return;

  }


  commentsList.innerHTML = "";


  data.forEach(
    comment => {

      const commentElement =
        document.createElement("div");


      commentElement.className =
        "comment";


      const canDelete =
        currentUser &&
        (
          comment.user_id === currentUser.id ||
          post.user_id === currentUser.id
        );


      commentElement.innerHTML = `

        <div class="comment-head">

          <div class="comment-avatar">
            Z
          </div>


          <div class="comment-info">

            <b>Zinko User</b>

            <small class="muted">
              ${formatDate(comment.created_at)}
            </small>

          </div>


          ${
            canDelete
              ? `
                <button
                  type="button"
                  class="comment-delete"
                  data-comment-id="${escapeAttribute(comment.id)}"
                  data-post-id="${escapeAttribute(post.id)}"
                >
                  Delete
                </button>
              `
              : ""
          }

        </div>


        <div class="comment-text">
          ${escapeHTML(comment.content || "")}
        </div>

      `;


      commentsList.appendChild(
        commentElement
      );

    }
  );

}


/* ================================
   ADD COMMENT
================================ */

async function addComment(
  postId,
  article
) {

  const input =
    article.querySelector(
      ".comment-input"
    );


  const message =
    article.querySelector(
      ".comment-message"
    );


  const text =
    input.value.trim();


  if (!text) {

    message.textContent =
      "Write a comment first.";

    return;

  }


  await loadCurrentUser();


  if (!currentUser) {

    message.textContent =
      "Please log in before commenting.";

    return;

  }


  const sendButton =
    article.querySelector(
      ".comment-send"
    );


  sendButton.disabled = true;

  sendButton.textContent =
    "...";


  const {
    error
  } =
    await supabaseClient
      .from("comments")
      .insert({

        post_id: postId,

        user_id: currentUser.id,

        content: text

      });


  if (error) {

    console.error(error);


    message.textContent =
      error.message;


    sendButton.disabled = false;

    sendButton.textContent =
      "Send";


    return;

  }


  input.value = "";


  message.textContent =
    "Comment added!";


  sendButton.disabled = false;

  sendButton.textContent =
    "Send";


  const {
    data: postData
  } =
    await supabaseClient
      .from("posts")
      .select("*")
      .eq(
        "id",
        postId
      )
      .maybeSingle();


  if (postData) {

    await loadComments(
      postData,
      article
    );

  }

}


/* ================================
   DELETE COMMENT
================================ */

async function deleteComment(
  commentId,
  postId,
  commentElement
) {

  await loadCurrentUser();


  if (!currentUser) {

    alert(
      "Please log in before deleting a comment."
    );

    return;

  }


  const confirmed =
    confirm(
      "Delete this comment?"
    );


  if (!confirmed) {

    return;

  }


  const deleteButton =
    commentElement.querySelector(
      ".comment-delete"
    );


  if (deleteButton) {

    deleteButton.disabled = true;

    deleteButton.textContent =
      "Deleting...";

  }


  const {
    error
  } =
    await supabaseClient
      .from("comments")
      .delete()
      .eq(
        "id",
        commentId
      );


  if (error) {

    console.error(error);


    alert(
      error.message
    );


    if (deleteButton) {

      deleteButton.disabled = false;

      deleteButton.textContent =
        "Delete";

    }


    return;

  }


  commentElement.remove();


  const commentsSection =
    document.getElementById(
      `comments-${postId}`
    );


  if (commentsSection) {

    const commentsList =
      commentsSection.querySelector(
        ".comments-list"
      );


    if (
      commentsList &&
      commentsList.children.length === 0
    ) {

      commentsList.innerHTML =
        `<div class="muted" style="margin-top:8px;">No comments yet.</div>`;

    }

  }

}


/* ================================
   LIKE / UNLIKE
================================ */

async function toggleLike(
  postId,
  button
) {

  await loadCurrentUser();


  if (!currentUser) {

    alert(
      "Please log in to like posts."
    );

    return;

  }


  const {
    data: existingLike,
    error: checkError
  } =
    await supabaseClient
      .from("post_likes")
      .select("id")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (checkError) {

    console.error(checkError);


    alert(
      checkError.message
    );


    return;

  }


  if (existingLike) {

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "id",
        existingLike.id
      );


    if (error) {

      console.error(error);

      alert(error.message);

      return;

    }


    button.classList.remove(
      "liked"
    );

  } else {

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .insert({

        post_id: postId,

        user_id: currentUser.id

      });


    if (error) {

      console.error(error);

      alert(error.message);

      return;

    }


    button.classList.add(
      "liked"
    );

  }


  await refreshLikeCount(
    postId,
    button
  );

}


/* ================================
   REFRESH LIKE COUNT
================================ */

async function refreshLikeCount(
  postId,
  button
) {

  const {
    count,
    error
  } =
    await supabaseClient
      .from("post_likes")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "post_id",
        postId
      );


  if (error) {

    console.error(error);

    return;

  }


  const countElement =
    button.querySelector(
      ".like-count"
    );


  if (countElement) {

    countElement.textContent =
      count || 0;

  }

}


/* ================================
   UPDATE LIKE STATES
================================ */

async function updateLikeStates() {

  if (!currentUser) {

    return;

  }


  const {
    data: likes,
    error
  } =
    await supabaseClient
      .from("post_likes")
      .select("post_id")
      .eq(
        "user_id",
        currentUser.id
      );


  if (error) {

    console.error(error);

    return;

  }


  const likedPosts =
    new Set(
      (likes || []).map(
        like => like.post_id
      )
    );


  document
    .querySelectorAll(
      ".like-button"
    )
    .forEach(
      button => {

        if (
          likedPosts.has(
            button.dataset.postId
          )
        ) {

          button.classList.add(
            "liked"
          );

        }

      }
    );

}


/* ================================
   CREATE POST
================================ */

postButton.addEventListener(
  "click",
  async () => {

    const text =
      postText.value.trim();


    if (
      !text &&
      !selectedPhoto &&
      !selectedVideo
    ) {

      postMessage.textContent =
        "Write something, add a photo, or add a video.";

      return;

    }


    postButton.disabled = true;

    postButton.textContent =
      "Posting...";


    postMessage.textContent =
      "";


    try {

      await loadCurrentUser();


      if (!currentUser) {

        throw new Error(
          "Please log in before creating a post."
        );

      }


      const user =
        currentUser;


      let imageURL = null;

      let videoURL = null;


      /* PHOTO */

      if (selectedPhoto) {

        const extension =
          selectedPhoto.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          `${user.id}/images/${Date.now()}.${extension}`;


        const {
          error: uploadError
        } =
          await supabaseClient.storage
            .from("post-media")
            .upload(
              fileName,
              selectedPhoto,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        const {
          data: publicURLData
        } =
        supabaseClient.storage
          .from("post-media")
          .getPublicUrl(
            fileName
          );


        imageURL =
          publicURLData.publicUrl;

      }


      /* VIDEO */

      if (selectedVideo) {

        const extension =
          selectedVideo.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          `${user.id}/videos/${Date.now()}.${extension}`;


        const {
          error: uploadError
        } =
        await supabaseClient.storage
          .from("post-media")
          .upload(
            fileName,
            selectedVideo,
            {
              cacheControl: "3600",
              upsert: false,
              contentType:
                selectedVideo.type ||
                "video/mp4"
            }
          );


        if (uploadError) {

          throw uploadError;

        }


        const {
          data: publicURLData
        } =
        supabaseClient.storage
          .from("post-media")
          .getPublicUrl(
            fileName
          );


        videoURL =
          publicURLData.publicUrl;

      }


      /* SAVE POST */

      const {
        error: insertError
      } =
      await supabaseClient
        .from("posts")
        .insert({

          user_id:
            user.id,

          content:
            text,

          image_url:
            imageURL,

          video_url:
            videoURL

        });


      if (insertError) {

        throw insertError;

      }


      postText.value = "";

      photoInput.value = "";

      videoInput.value = "";

      selectedPhoto = null;

      selectedVideo = null;

      mediaPreview.innerHTML = "";


      postMessage.textContent =
        "Posted successfully! 🎉";


      await loadPosts();


    } catch (error) {

      console.error(error);


      postMessage.textContent =
        error.message;

    }


    postButton.disabled = false;

    postButton.textContent =
      "Post";

  }
);


/* ================================
   PAGE CLICK EVENTS
================================ */

postsContainer.addEventListener(
  "click",
  async event => {

    /* LIKE */

    const likeButton =
      event.target.closest(
        ".like-button"
      );


    if (likeButton) {

      await toggleLike(
        likeButton.dataset.postId,
        likeButton
      );

      return;

    }


    /* COMMENT SEND */

    const commentButton =
      event.target.closest(
        ".comment-send"
      );


    if (commentButton) {

      const article =
        commentButton.closest(
          ".post"
        );


      await addComment(
        commentButton.dataset.postId,
        article
      );


      return;

    }


    /* DELETE COMMENT */

    const deleteButton =
      event.target.closest(
        ".comment-delete"
      );


    if (deleteButton) {

      const commentElement =
        deleteButton.closest(
          ".comment"
        );


      await deleteComment(
        deleteButton.dataset.commentId,
        deleteButton.dataset.postId,
        commentElement
      );


      return;

    }


    /* COMMENT TOGGLE */

    const commentToggle =
      event.target.closest(
        ".comment-toggle"
      );


    if (commentToggle) {

      const comments =
        document.getElementById(
          `comments-${commentToggle.dataset.postId}`
        );


      if (comments) {

        comments.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });


        const input =
          comments.querySelector(
            ".comment-input"
          );


        if (input) {

          input.focus();

        }

      }


      return;

    }


    /* SHARE */

    const shareButton =
      event.target.closest(
        ".share-button"
      );


    if (shareButton) {

      const postId =
        shareButton.dataset.postId;


      const shareURL =
        window.location.href.split("#")[0]
        + "#post-"
        + postId;


      if (navigator.share) {

        try {

          await navigator.share({

            title:
              "Zinko",

            text:
              "Check out this Zinko post.",

            url:
              shareURL

          });

        } catch (error) {

          console.log(
            "Share cancelled."
          );

        }

      } else {

        try {

          await navigator.clipboard.writeText(
            shareURL
          );


          alert(
            "Post link copied!"
          );

        } catch (error) {

          alert(
            "Unable to copy post link."
          );

        }

      }


      return;

    }


    /* SAVE */

    const saveButton =
      event.target.closest(
        ".save-button"
      );


    if (saveButton) {

      saveButton.classList.toggle(
        "saved"
      );


      if (
        saveButton.classList.contains(
          "saved"
        )
      ) {

        alert(
          "Post saved on this page."
        );

      }


      return;

    }

  }
);


/* ================================
   ENTER TO SEND COMMENT
================================ */

postsContainer.addEventListener(
  "keydown",
  event => {

    if (
      event.key !== "Enter" ||
      event.shiftKey
    ) {

      return;

    }


    const input =
      event.target.closest(
        ".comment-input"
      );


    if (!input) {

      return;

    }


    event.preventDefault();


    const article =
      input.closest(
        ".post"
      );


    const button =
      article.querySelector(
        ".comment-send"
      );


    if (button) {

      button.click();

    }

  }
);


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text || "";


  return div.innerHTML;

}


/* ================================
   ESCAPE ATTRIBUTE
================================ */

function escapeAttribute(text) {

  return String(
    text || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


/* ================================
   DATE
================================ */

function formatDate(
  dateString
) {

  if (!dateString) {

    return "";

  }


  const date =
    new Date(
      dateString
    );


  return date.toLocaleString();

}
