<style>

.creator-row{

.creator-avatar{

.creator-info{

}

.creator-info b{

.recent-live-section{

}

.recent-live-section h3{

}

.ended-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin-bottom:9px;
  background:#101728;
  border:1px solid #202840;

}

.ended-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;

.ended-info{

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ggqhwoyzuypryocrxiru.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_RIB0a5lVDxK8iqvTB1lr8A_JLnaMvF_";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const liveGrid =
document.getElementById("liveGrid");

const creatorList =
document.getElementById("creatorList");

const recentLiveList =
document.getElementById("recentLiveList");

const refreshButton =
document.getElementById("refreshButton");


/* =====================================================
   STATE
===================================================== */

let currentLiveSessions = [];


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getInitial(value){

  const text =
    String(value || "Z").trim();

  return (
    text.charAt(0).toUpperCase() ||
    "Z"
  );

}


function getLiveEmoji(category){

  const value =
    String(category || "").toLowerCase();

  if(value.includes("music")){
    return "🎵";
  }

  if(value.includes("gaming")){
    return "🎮";
  }

  if(
    value.includes("talk") ||
    value.includes("chat")
  ){
    return "🎤";
  }

  if(value.includes("comedy")){
    return "😂";
  }

  if(value.includes("sport")){
    return "⚽";
  }

  if(value.includes("food")){
    return "🍔";
  }

  if(value.includes("education")){
    return "📚";
  }

  if(value.includes("news")){
    return "📰";
  }

  return "🔴";

}


function getLiveBackground(index){

  const backgrounds = [
    "live-purple",
    "live-red",
    "live-blue",
    "live-green",
    "live-orange",
    "live-pink"
  ];

  return backgrounds[
    index % backgrounds.length
  ];

}


function formatHost(hostId){

  if(!hostId){
    return "Zinko Creator";
  }

  const id =
    String(hostId);

  return (
    "Creator " +
    id.substring(0,6)
  );

}


/* =====================================================
   REAL ELAPSED TIME
===================================================== */

function formatStartedAgo(createdAt){

  if(!createdAt){
    return "Started just now";
  }

  const start =
    new Date(createdAt).getTime();

  if(!Number.isFinite(start)){
    return "Started just now";
  }

  const now =
    Date.now();

  let difference =
    now - start;

  if(difference < 0){
    difference = 0;
  }

  const totalSeconds =
    Math.floor(
      difference / 1000
    );

  if(totalSeconds < 60){

    return "Started just now";

  }

  const totalMinutes =
    Math.floor(
      totalSeconds / 60
    );

  if(totalMinutes < 60){

    return (
      "Started " +
      totalMinutes +
      (
        totalMinutes === 1
        ? " minute"
        : " minutes"
      ) +
      " ago"
    );

  }

  const totalHours =
    Math.floor(
      totalMinutes / 60
    );

  if(totalHours < 24){

    return (
      "Started " +
      totalHours +
      (
        totalHours === 1
        ? " hour"
        : " hours"
      ) +
      " ago"
    );

  }

  const totalDays =
    Math.floor(
      totalHours / 24
    );

  return (
    "Started " +
    totalDays +
    (
      totalDays === 1
      ? " day"
      : " days"
    ) +
    " ago"
  );

}


/* =====================================================
   ENDED TIME
===================================================== */

function formatEndedAt(endedAt){

  if(!endedAt){
    return "End time unavailable";
  }

  const date =
    new Date(endedAt);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "End time unavailable";

  }

  const now =
    new Date();

  const today =
    date.toDateString() ===
    now.toDateString();

  const yesterday =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() - 1
    ).toDateString() ===
    date.toDateString();

  const time =
    date.toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

  if(today){
    return "Today at " + time;
  }

  if(yesterday){
    return "Yesterday at " + time;
  }

  return (
    date.toLocaleDateString(
      [],
      {
        month:"short",
        day:"numeric",
        year:"numeric"
      }
    ) +
    " at " +
    time
  );

}


/* =====================================================
   VIEWER COUNT
===================================================== */

async function getViewerCount(liveId){

  const activeSince =
    new Date(
      Date.now() - 90000
    ).toISOString();

  const {
    count,
    error
  } =
  await supabaseClient
    .from("zinko_live_viewers")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "live_id",
      liveId
    )
    .gte(
      "last_seen_at",
      activeSince
    );

  if(error){

    console.error(
      "Viewer count error:",
      error
    );

    return 0;

  }

  return count || 0;

}


/* =====================================================
   LOAD LIVE SESSIONS
===================================================== */

async function loadLiveStreams(){

  liveGrid.innerHTML = `
    <div class="loading-live">
      Loading live streams...
    </div>
  `;

  creatorList.innerHTML = `
    <div class="loading-live">
      Loading creators...
    </div>
  `;

  recentLiveList.innerHTML = `
    <div class="loading-live">
      Loading recent lives...
    </div>
  `;


  const {
    data:liveData,
    error:liveError
  } =
  await supabaseClient
    .from("zinko_live_sessions")
    .select("*")
    .eq(
      "status",
      "live"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(liveError){

    console.error(
      "Live sessions error:",
      liveError
    );

    currentLiveSessions = [];

    liveGrid.innerHTML = `
      <div class="live-error">
        Could not load live streams.
        <br><br>
        Please check your internet connection and try again.
      </div>
    `;

    creatorList.innerHTML = "";
    recentLiveList.innerHTML = "";

    return;

  }


  currentLiveSessions =
    liveData || [];


  const {
    data:endedData,
    error:endedError
  } =
  await supabaseClient
    .from("zinko_live_sessions")
    .select("*")
    .eq(
      "status",
      "ended"
    )
    .order(
      "ended_at",
      {
        ascending:false
      }
    )
    .limit(10);


  if(endedError){

    console.error(
      "Recent lives error:",
      endedError
    );

  }


  /* ===================================================
     CURRENT LIVE
  =================================================== */

  if(
    !liveData ||
    liveData.length === 0
  ){

    liveGrid.innerHTML = `
      <div class="empty-live">

        <div class="empty-live-icon">
          📺
        </div>

        <strong>
          No one is live right now
        </strong>

        <p>
          When a creator starts a Zinko Live,
          it will appear here automatically.
        </p>

      </div>
    `;

    creatorList.innerHTML = `
      <div class="empty-live">

        <div class="empty-live-icon">
          🟢
        </div>

        <strong>
          No creators are currently live
        </strong>

        <p>
          Start your own live or check again later.
        </p>

      </div>
    `;

  }else{

    liveGrid.innerHTML = "";
    creatorList.innerHTML = "";


    for(
      let index = 0;
      index < liveData.length;
      index++
    ){

      const live =
        liveData[index];

      const title =
        live.title ||
        "Zinko Live";

      const category =
        live.category ||
        "General";

      const creator =
        formatHost(
          live.host_id
        );

      const viewerCount =
        await getViewerCount(
          live.id
        );

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "live-card";

      card.innerHTML = `

        <div
          class="live-media ${getLiveBackground(index)}"
        >

          <span class="live-badge">
            LIVE
          </span>

          <span class="viewer-badge">
            👁 ${viewerCount}
          </span>

          <div class="live-symbol">
            ${escapeHtml(
              getLiveEmoji(category)
            )}
          </div>

        </div>


        <div class="live-info">

          <h3>
            ${escapeHtml(title)}
          </h3>

          <p>
            ${escapeHtml(creator)}
            · Live now on Zinko
          </p>

          <span
            class="live-time"
            data-live-time-id="${escapeHtml(live.id)}"
          >
            🔴 ${escapeHtml(
              formatStartedAgo(
                live.created_at
              )
            )}
          </span>

          <span class="live-category">
            🎬 ${escapeHtml(category)}
          </span>

          <div class="live-actions">

            <button
              class="btn primary watch-button"
              type="button"
              data-live-id="${escapeHtml(live.id)}"
            >
              Watch Live
            </button>

          </div>

        </div>

      `;


      const watchButton =
        card.querySelector(
          ".watch-button"
        );

      watchButton.addEventListener(
        "click",
        ()=>{
          watchLive(
            live.id
          );
        }
      );

      liveGrid.appendChild(
        card
      );


      /* =================================================
         CREATOR ROW
      ================================================= */

      const creatorRow =
        document.createElement(
          "div"
        );

      creatorRow.className =
        "creator-row";

      creatorRow.innerHTML = `

        <div class="creator-avatar">
          ${escapeHtml(
            getInitial(creator)
          )}
        </div>

        <div class="creator-info">

          <b>
            ${escapeHtml(creator)}
          </b>

          <small>
            ${escapeHtml(title)}
          </small>

          <span
            class="creator-time"
            data-live-time-id="${escapeHtml(live.id)}"
          >
            🔴 ${escapeHtml(
              formatStartedAgo(
                live.created_at
              )
            )}
          </span>

        </div>

        <span class="online-dot"></span>

      `;

      creatorList.appendChild(
        creatorRow
      );

    }

  }


  /* ===================================================
     RECENTLY ENDED
  =================================================== */

  if(
    !endedData ||
    endedData.length === 0
  ){

    recentLiveList.innerHTML = `
      <div class="empty-live">

        <div class="empty-live-icon">
          🕘
        </div>

        <strong>
          No recent lives
        </strong>

        <p>
          Ended Zinko Lives will appear here.
        </p>

      </div>
    `;

  }else{

    recentLiveList.innerHTML = "";

    endedData.forEach(
      live=>{

        const title =
          live.title ||
          "Zinko Live";

        const category =
          live.category ||
          "General";

        const creator =
          formatHost(
            live.host_id
          );

        const endedTime =
          formatEndedAt(
            live.ended_at
          );

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "ended-card";

        row.innerHTML = `

          <div class="ended-icon">
            ${escapeHtml(
              getLiveEmoji(category)
            )}
          </div>

          <div class="ended-info">

            <strong>
              ${escapeHtml(title)}
            </strong>

            <small>
              ${escapeHtml(creator)}
              · ${escapeHtml(category)}
            </small>

            <span class="ended-time">
              ⏹ Ended · ${escapeHtml(endedTime)}
            </span>

          </div>

          <span class="ended-label">
            Ended
          </span>

        `;

        recentLiveList.appendChild(
          row
        );

      }
    );

  }

}


/* =====================================================
   WATCH LIVE
===================================================== */

function watchLive(liveId){

  if(!liveId){

    alert(
      "This live session is unavailable."
    );

    return;

  }

  window.location.href =
    "live-room.html?live=" +
    encodeURIComponent(
      liveId
    );

}


/* =====================================================
   UPDATE LIVE TIMES
===================================================== */

/*
  This function does NOT reload the page.

  It directly updates the existing time labels
  using the original created_at timestamp.

  It runs every 1 second so the timer is always
  ready to change exactly when a minute passes.
*/

function updateLiveTimeLabels(){

  const timeElements =
    document.querySelectorAll(
      "[data-live-time-id]"
    );

  timeElements.forEach(
    element=>{

      const liveId =
        element.getAttribute(
          "data-live-time-id"
        );

      const live =
        currentLiveSessions.find(
          session =>
            String(session.id) ===
            String(liveId)
        );

      if(!live){
        return;
      }

      element.textContent =
        "🔴 " +
        formatStartedAgo(
          live.created_at
        );

    }
  );

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

async function refreshLives(){

  refreshButton.disabled =
    true;

  refreshButton.textContent =
    "↻ Loading...";

  try{

    await loadLiveStreams();

  }finally{

    refreshButton.disabled =
      false;

    refreshButton.textContent =
      "↻ Refresh";

  }

}


refreshButton.addEventListener(
  "click",
  refreshLives
);


/* =====================================================
   REALTIME SUPABASE UPDATES
===================================================== */

let liveRealtimeChannel = null;


function setupLiveRealtime(){

  liveRealtimeChannel =
    supabaseClient
      .channel(
        "zinko-live-list"
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"zinko_live_sessions"
        },
        ()=>{
          loadLiveStreams();
        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"zinko_live_viewers"
        },
        ()=>{
          loadLiveStreams();
        }
      )

      .subscribe(
        status=>{

          console.log(
            "Live list realtime:",
            status
          );

        }
      );

}


/* =====================================================
   AUTOMATIC SESSION REFRESH
===================================================== */

setInterval(
  ()=>{
    loadLiveStreams();
  },
  15000
);


/* =====================================================
   REAL LIVE TIMER
===================================================== */

/*
  Update every second.

  The displayed value changes automatically
  when the real elapsed time reaches another minute.
*/

const liveTimerInterval =
  setInterval(
    updateLiveTimeLabels,
    1000
  );


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize(){

  await loadLiveStreams();

  setupLiveRealtime();

  updateLiveTimeLabels();

}


initialize();


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  ()=>{

    clearInterval(
      liveTimerInterval
    );

    if(
      liveRealtimeChannel
    ){

      supabaseClient
        .removeChannel(
          liveRealtimeChannel
        );

    }

  }
);

</script>

</body>
