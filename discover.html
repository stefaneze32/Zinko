<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discover — Zinko</title>

  <link rel="stylesheet" href="style.css">

<body>

<div class="app">

        <div
          class="hashtag"
          data-search="#Music"
        >
          #Music
          <br>
          <b>Trending</b>
        </div>

        <div
          class="hashtag"
          data-search="#Tech"
        >
          #Tech
          <br>
          <b>Discover</b>
        </div>

      </div>

    </section>


    <!-- CREATORS -->
    <section id="creatorSection">

      <h3>Creators to discover</h3>

      <div id="creatorList">

        <div class="empty">
          Creators will appear here as Zinko grows.
        </div>

      </div>

    </section>


    <!-- POSTS -->
    <section id="postSection">

      <h3>Discover posts</h3>

      <div id="postList"></div>

    </section>


    <!-- LIVE -->

      <h3>Live now</h3>

        </div>

    <!-- SEARCH EMPTY -->

    >
      No results found.
    </div>

  </main>


  <!-- NAVIGATION -->
  <nav class="nav">

    <a href="home.html">
      ⌂
      <small>Home</small>
    </a>

    <a href="live.html">
      ◉
      <small>Live</small>
    </a>

    <a
      class="active"
      href="discover.html"
    >
      ⌕
      <small>Discover</small>
    </a>

    <a href="messages.html">
      ✉
      <small>Messages</small>
    </a>

    <a href="profile.html">
      ●
      <small>Profile</small>
    </a>

  </nav>

</div>


<script>

/* =========================================================
   ZINKO SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL =
  "https://ggqhwoyzuypryocrxiru.supabase.co";


/*
 IMPORTANT:
 Use your Supabase Publishable key below.

 Do NOT use the secret/service_role key.
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_RIB0a5lVDxK8iqvTB1lr8A_JLnaMvF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   ELEMENTS
   ========================================================= */

const searchInput =
  document.getElementById("searchInput");

const postList =
  document.getElementById("postList");

const creatorList =
  document.getElementById("creatorList");

const statusMessage =
  document.getElementById("statusMessage");

const noResults =
  document.getElementById("noResults");

const hashtagSection =
  document.getElementById("hashtagSection");

const creatorSection =
  document.getElementById("creatorSection");

const postSection =
  document.getElementById("postSection");

const liveSection =
  document.getElementById("liveSection");

const liveList =
  document.getElementById("liveList");


let allPosts = [];
let currentTab = "trending";
let currentUser = null;


/* =========================================================
   CURRENT USER
   ========================================================= */

async function loadCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if (error) {

    console.error(
      "User error:",
      error
    );

    currentUser = null;

    return null;

  }


  currentUser =
    data && data.user
      ? data.user
      : null;


  return currentUser;

}


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}


function formatDate(dateValue) {

  if (!dateValue) {

    return "";

  }

  const date =
    new Date(dateValue);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleDateString(
    undefined,
    {
      day: "numeric",
      month: "short"
    }
  );

}


function formatDateTime(dateValue) {

  if (!dateValue) {

    return "";

  }

  const date =
    new Date(dateValue);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleString();

}


function shortUserId(id) {

  if (!id) {

    return "Zinko creator";

  }


  return "Creator " +
    String(id).slice(0, 6);

}


function getPostText(post) {

  return (
    post.content ||
    ""
  );

}


/* =========================================================
   LOAD POSTS
   ========================================================= */

async function loadPosts() {

  statusMessage.textContent =
    "Loading Zinko posts…";


  await loadCurrentUser();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("posts")
      .select(
        "id,user_id,content,created_at,image_url,video_url"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(50);


  if (error) {

    console.error(
      "Posts error:",
      error
    );


    statusMessage.textContent =
      "Unable to load posts right now.";


    postList.innerHTML = `
      <div class="empty">
        There was a problem connecting to Zinko.
      </div>
    `;


    return;

  }


  allPosts =
    data || [];


  statusMessage.textContent =
    allPosts.length
      ? `${allPosts.length} posts discovered`
      : "No posts yet.";


  await renderPosts(
    allPosts
  );


  buildCreators(
    allPosts
  );

}


/* =========================================================
   RENDER POSTS
   ========================================================= */

async function renderPosts(posts) {

  postList.innerHTML = "";


  noResults.style.display =
    posts.length
      ? "none"
      : "block";


  if (!posts.length) {

    return;

  }


  for (
    const post of posts
  ) {

    await renderSinglePost(
      post
    );

  }


  await updateLikeStates();

}


/* =========================================================
   RENDER ONE POST
   ========================================================= */

async function renderSinglePost(post) {

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "post";


  article.dataset.postId =
    post.id;


  const initial =
    post.user_id
      ? String(
          post.user_id
        )
          .charAt(0)
          .toUpperCase()
      : "Z";


  /* =======================================================
     GET LIKE COUNT
     ======================================================= */

  const {
    count: likeCount,
    error: likeCountError
  } =
    await supabaseClient
      .from("post_likes")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "post_id",
        post.id
      );


  if (likeCountError) {

    console.error(
      "Like count error:",
      likeCountError
    );

  }


  /* =======================================================
     MEDIA
     ======================================================= */

  let mediaHTML = "";


  if (post.image_url) {

    mediaHTML = `
      <img
        src="${escapeAttribute(post.image_url)}"
        alt="Zinko post"
        style="
          width:100%;
          max-height:410px;
          object-fit:cover;
          border-radius:18px;
          display:block;
          margin-top:12px;
        "
        loading="lazy"
        onerror="this.style.display='none'"
      >
    `;

  }


  else if (post.video_url) {

    mediaHTML = `
      <video
        controls
        playsinline
        preload="metadata"
        style="
          width:100%;
          max-height:410px;
          border-radius:18px;
          display:block;
          margin-top:12px;
          background:#000;
        "
      >
        <source
          src="${escapeAttribute(post.video_url)}"
        >
      </video>
    `;

  }


  /* =======================================================
     POST HTML
     ======================================================= */

  article.innerHTML = `

    <div class="post-head">

      <div class="avatar">
        ${escapeHTML(initial)}
      </div>

      <div>

        <b>
          ${escapeHTML(
            shortUserId(
              post.user_id
            )
          )}
        </b>

        <small>
          ${escapeHTML(
            formatDate(
              post.created_at
            )
          )}
        </small>

      </div>

      <button
        class="more"
        type="button"
      >
        ⋯
      </button>

    </div>


    ${
      getPostText(post)
        ? `
          <p>
            ${escapeHTML(
              getPostText(post)
            )}
          </p>
        `
        : ""
    }


    ${mediaHTML}


    <!-- ENGAGEMENT -->

    <div
      class="engage"
      style="
        margin-top:10px;
        flex-wrap:wrap;
      "
    >

      <button
        type="button"
        class="like-button"
        data-post-id="${escapeAttribute(post.id)}"
      >
        ♡
        <span class="like-label">
          Like
        </span>
        <span class="like-count">
          ${likeCount || 0}
        </span>
      </button>


      <button
        type="button"
        class="comment-toggle"
        data-post-id="${escapeAttribute(post.id)}"
      >
        💬
        <span>
          Comment
        </span>
      </button>


      <button
        type="button"
        class="share-button"
        data-post-id="${escapeAttribute(post.id)}"
      >
        ↗
        Share
      </button>

    </div>


    <!-- COMMENTS -->

    <div
      class="comments-section"
      id="comments-${escapeAttribute(post.id)}"
      style="display:none;"
    >

      <b>
        Comments
      </b>


      <div class="comments-list">
        Loading comments...
      </div>


      <div
        class="comment-form"
        style="
          display:flex;
          gap:8px;
          margin-top:10px;
        "
      >

        <input
          type="text"
          class="comment-input"
          placeholder="Write a comment..."
          maxlength="1000"
          style="
            flex:1;
            min-width:0;
            padding:10px;
            border-radius:12px;
            border:1px solid #29314b;
            background:#0b1120;
            color:white;
            outline:none;
          "
        >


        <button
          type="button"
          class="comment-send"
          data-post-id="${escapeAttribute(post.id)}"
          style="
            border:0;
            border-radius:12px;
            padding:10px 14px;
            background:#7155ff;
            color:white;
            font-weight:bold;
            cursor:pointer;
          "
        >
          Send
        </button>

      </div>


      <div
        class="comment-message muted"
        style="
          font-size:12px;
          margin-top:6px;
        "
      ></div>

    </div>

  `;


  postList.appendChild(
    article
  );


  /* Load comments */

  await loadComments(
    post,
    article
  );

}


/* =========================================================
   LOAD COMMENTS
   ========================================================= */

async function loadComments(
  post,
  article
) {

  const commentsList =
    article.querySelector(
      ".comments-list"
    );


  if (!commentsList) {

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq(
        "post_id",
        post.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Comments error:",
      error
    );


    commentsList.innerHTML = `
      <div class="muted">
        Unable to load comments.
      </div>
    `;


    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    commentsList.innerHTML = `
      <div
        class="muted"
        style="margin-top:8px;"
      >
        No comments yet.
      </div>
    `;


    return;

  }


  commentsList.innerHTML = "";


  data.forEach(
    comment => {

      const commentElement =
        document.createElement(
          "div"
        );


      commentElement.className =
        "comment";


      commentElement.style.cssText = `
        background:#0b1120;
        border:1px solid #202840;
        border-radius:12px;
        padding:10px;
        margin-top:8px;
      `;


      const canDelete =
        currentUser &&
        (
          comment.user_id ===
            currentUser.id ||

          post.user_id ===
            currentUser.id
        );


      commentElement.innerHTML = `

        <div
          style="
            display:flex;
            gap:8px;
            align-items:center;
          "
        >

          <div
            style="
              width:30px;
              height:30px;
              border-radius:50%;
              background:linear-gradient(
                135deg,
                #5865f2,
                #20c7df
              );
              color:white;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:12px;
              font-weight:bold;
            "
          >
            Z
          </div>


          <div
            style="
              flex:1;
              min-width:0;
            "
          >

            <b>
              Zinko User
            </b>

            <small
              class="muted"
              style="display:block;"
            >
              ${escapeHTML(
                formatDateTime(
                  comment.created_at
                )
              )}
            </small>

          </div>


          ${
            canDelete
              ? `
                <button
                  type="button"
                  class="comment-delete"
                  data-comment-id="${escapeAttribute(comment.id)}"
                  data-post-id="${escapeAttribute(post.id)}"
                  style="
                    border:0;
                    background:transparent;
                    color:#ff6b81;
                    font-size:13px;
                    font-weight:bold;
                    cursor:pointer;
                  "
                >
                  Delete
                </button>
              `
              : ""
          }

        </div>


        <div
          style="
            margin:7px 0 0 38px;
            word-break:break-word;
          "
        >
          ${escapeHTML(
            comment.content || ""
          )}
        </div>

      `;


      commentsList.appendChild(
        commentElement
      );

    }
  );

}


/* =========================================================
   ADD COMMENT
   ========================================================= */

async function addComment(
  postId,
  article
) {

  const input =
    article.querySelector(
      ".comment-input"
    );


  const message =
    article.querySelector(
      ".comment-message"
    );


  const sendButton =
    article.querySelector(
      ".comment-send"
    );


  const text =
    input.value.trim();


  if (!text) {

    message.textContent =
      "Write a comment first.";

    return;

  }


  await loadCurrentUser();


  if (!currentUser) {

    message.textContent =
      "Please log in before commenting.";

    return;

  }


  sendButton.disabled =
    true;


  sendButton.textContent =
    "...";


  message.textContent =
    "";


  const {
    error
  } =
    await supabaseClient
      .from("comments")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id,

        content:
          text

      });


  if (error) {

    console.error(
      "Add comment error:",
      error
    );


    message.textContent =
      error.message;


    sendButton.disabled =
      false;


    sendButton.textContent =
      "Send";


    return;

  }


  input.value = "";


  message.textContent =
    "Comment added!";


  sendButton.disabled =
    false;


  sendButton.textContent =
    "Send";


  const {
    data: postData,
    error: postError
  } =
    await supabaseClient
      .from("posts")
      .select("*")
      .eq(
        "id",
        postId
      )
      .maybeSingle();


  if (
    postError ||
    !postData
  ) {

    console.error(
      "Post reload error:",
      postError
    );

    return;

  }


  await loadComments(
    postData,
    article
  );

}


/* =========================================================
   DELETE COMMENT
   ========================================================= */

async function deleteComment(
  commentId,
  postId,
  commentElement
) {

  await loadCurrentUser();


  if (!currentUser) {

    alert(
      "Please log in before deleting a comment."
    );

    return;

  }


  const confirmed =
    confirm(
      "Delete this comment?"
    );


  if (!confirmed) {

    return;

  }


  const deleteButton =
    commentElement.querySelector(
      ".comment-delete"
    );


  if (deleteButton) {

    deleteButton.disabled =
      true;

    deleteButton.textContent =
      "Deleting...";

  }


  const {
    error
  } =
    await supabaseClient
      .from("comments")
      .delete()
      .eq(
        "id",
        commentId
      );


  if (error) {

    console.error(
      "Delete comment error:",
      error
    );


    alert(
      error.message
    );


    if (deleteButton) {

      deleteButton.disabled =
        false;

      deleteButton.textContent =
        "Delete";

    }


    return;

  }


  commentElement.remove();


  const commentsSection =
    document.getElementById(
      `comments-${postId}`
    );


  if (commentsSection) {

    const commentsList =
      commentsSection.querySelector(
        ".comments-list"
      );


    if (
      commentsList &&
      commentsList.children.length === 0
    ) {

      commentsList.innerHTML = `
        <div
          class="muted"
          style="margin-top:8px;"
        >
          No comments yet.
        </div>
      `;

    }

  }

}


/* =========================================================
   LIKE / UNLIKE
   ========================================================= */

async function toggleLike(
  postId,
  button
) {

  await loadCurrentUser();


  if (!currentUser) {

    alert(
      "Please log in to like posts."
    );

    return;

  }


  button.disabled =
    true;


  const {
    data: existingLike,
    error: checkError
  } =
    await supabaseClient
      .from("post_likes")
      .select("id")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (checkError) {

    console.error(
      "Like check error:",
      checkError
    );


    alert(
      checkError.message
    );


    button.disabled =
      false;


    return;

  }


  if (existingLike) {

    const {
      error
    } =
      await supabaseClient
        .from("post_likes")
        .delete()
        .eq(
          "id",
          existingLike.id
        );


    if (error) {

      console.error(
        "Unlike error:",
        error
      );


      alert(
        error.message
      );


      button.disabled =
        false;


      return;

    }


    button.classList.remove(
      "liked"
    );


  } else {

    const {
      error
    } =
      await supabaseClient
        .from("post_likes")
        .insert({

          post_id:
            postId,

          user_id:
            currentUser.id

        });


    if (error) {

      console.error(
        "Like error:",
        error
      );


      alert(
        error.message
      );


      button.disabled =
        false;


      return;

    }


    button.classList.add(
      "liked"
    );

  }


  await refreshLikeCount(
    postId,
    button
  );


  button.disabled =
    false;

}


/* =========================================================
   REFRESH LIKE COUNT
   ========================================================= */

async function refreshLikeCount(
  postId,
  button
) {

  const {
    count,
    error
  } =
    await supabaseClient
      .from("post_likes")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "post_id",
        postId
      );


  if (error) {

    console.error(
      "Refresh like count error:",
      error
    );

    return;

  }


  const countElement =
    button.querySelector(
      ".like-count"
    );


  if (countElement) {

    countElement.textContent =
      count || 0;

  }

}


/* =========================================================
   UPDATE LIKE STATES
   ========================================================= */

async function updateLikeStates() {

  if (!currentUser) {

    return;

  }


  const {
    data: likes,
    error
  } =
    await supabaseClient
      .from("post_likes")
      .select("post_id")
      .eq(
        "user_id",
        currentUser.id
      );


  if (error) {

    console.error(
      "Like states error:",
      error
    );

    return;

  }


  const likedPosts =
    new Set(
      (likes || []).map(
        like =>
          like.post_id
      )
    );


  document
    .querySelectorAll(
      ".like-button"
    )
    .forEach(
      button => {

        if (
          likedPosts.has(
            button.dataset.postId
          )
        ) {

          button.classList.add(
            "liked"
          );

        }

      }
    );

}


/* =========================================================
   CREATORS
   ========================================================= */

function buildCreators(posts) {

  const creatorMap =
    new Map();


  posts.forEach(
    post => {

      if (!post.user_id) {

        return;

      }


      if (
        !creatorMap.has(
          post.user_id
        )
      ) {

        creatorMap.set(
          post.user_id,
          {
            id:
              post.user_id,

            posts:
              1
          }
        );

      } else {

        creatorMap.get(
          post.user_id
        ).posts++;

      }

    }
  );


  creatorList.innerHTML =
    "";


  const creators =
    Array.from(
      creatorMap.values()
    ).slice(
      0,
      10
    );


  if (!creators.length) {

    creatorList.innerHTML = `
      <div class="empty">
        No creators to discover yet.
      </div>
    `;

    return;

  }


  creators.forEach(
    creator => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "creator-card";


      const initial =
        String(
          creator.id
        )
          .charAt(0)
          .toUpperCase();


      card.innerHTML = `

        <div class="avatar pink">
          ${escapeHTML(initial)}
        </div>

        <div>

          <b>
            ${escapeHTML(
              shortUserId(
                creator.id
              )
            )}
          </b>

          <small>
            ${creator.posts}
            ${
              creator.posts === 1
                ? "post"
                : "posts"
            }
          </small>

        </div>

        <button
          class="follow"
          type="button"
          data-user-id="${escapeAttribute(
            creator.id
          )}"
        >
          Follow
        </button>

      `;


      creatorList.appendChild(
        card
      );

    }
  );


  document
    .querySelectorAll(
      ".follow"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            toggleFollow(
              button.dataset.userId,
              button
            )
        );

      }
    );

}


/* =========================================================
   FOLLOW / UNFOLLOW
   ========================================================= */

async function toggleFollow(
  followingId,
  button
) {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    alert(
      "Please sign in to follow creators."
    );

    return;

  }


  if (
    user.id === followingId
  ) {

    alert(
      "You cannot follow yourself."
    );

    return;

  }


  button.disabled =
    true;


  const {
    data: existing,
    error: findError
  } =
    await supabaseClient
      .from("follows")
      .select("id")
      .eq(
        "follower_id",
        user.id
      )
      .eq(
        "following_id",
        followingId
      )
      .maybeSingle();


  if (findError) {

    console.error(
      findError
    );


    alert(
      "Could not check follow status."
    );


    button.disabled =
      false;


    return;

  }


  if (existing) {

    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .delete()
        .eq(
          "id",
          existing.id
        );


    if (error) {

      console.error(
        error
      );


      alert(
        "Could not unfollow this creator."
      );

    } else {

      button.textContent =
        "Follow";

    }

  } else {

    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .insert({

          follower_id:
            user.id,

          following_id:
            followingId

        });


    if (error) {

      console.error(
        error
      );


      alert(
        "Could not follow this creator."
      );

    } else {

      button.textContent =
        "Following";

    }

  }


  button.disabled =
    false;

}


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener(
  "input",
  async () => {

    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!query) {

      await renderPosts(
        allPosts
      );

      return;

    }


    const results =
      allPosts.filter(
        post => {

          const content =
            (
              post.content ||
              ""
            )
              .toLowerCase();


          const userId =
            (
              post.user_id ||
              ""
            )
              .toLowerCase();


          return (
            content.includes(query) ||
            userId.includes(query)
          );

        }
      );


    await renderPosts(
      results
    );

  }
);


/* =========================================================
   TABS
   ========================================================= */

document
  .querySelectorAll(
    ".tabs button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".tabs button"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "tab-on"
                )
            );


          button.classList.add(
            "tab-on"
          );


          currentTab =
            button.dataset.tab;


          handleTab(
            currentTab
          );

        }
      );

    }
  );


async function handleTab(
  tab
) {

  hashtagSection.style.display =
    "block";


  creatorSection.style.display =
    "block";


  postSection.style.display =
    "block";


  liveSection.style.display =
    "none";


  if (
    tab === "trending"
  ) {

    await renderPosts(
      allPosts
    );

  }


  else if (
    tab === "recommended"
  ) {

    await renderPosts(
      allPosts.slice(
        0,
        20
      )
    );

  }


  else if (
    tab === "creators"
  ) {

    creatorSection.scrollIntoView({
      behavior:
        "smooth"
    });

  }


  else if (
    tab === "live"
  ) {

    hashtagSection.style.display =
      "none";


    creatorSection.style.display =
      "none";


    postSection.style.display =
      "none";


    liveSection.style.display =
      "block";


    loadLivePlaceholder();

  }

}


/* =========================================================
   LIVE PLACEHOLDER
   ========================================================= */

function loadLivePlaceholder() {

  liveList.innerHTML = `

    <div class="empty">

      Live streams will be connected
      to your existing
      <b>zinko_live_sessions</b>
      system next.

    </div>

  `;

}


/* =========================================================
   HASHTAGS
   ========================================================= */

document
  .querySelectorAll(
    ".hashtag"
  )
  .forEach(
    item => {

      item.style.cursor =
        "pointer";


      item.addEventListener(
        "click",
        async () => {

          const value =
            item.dataset.search;


          searchInput.value =
            value;


          const query =
            value.toLowerCase();


          const results =
            allPosts.filter(
              post =>
                (
                  post.content ||
                  ""
                )
                  .toLowerCase()
                  .includes(query)
            );


          await renderPosts(
            results
          );


          postSection.scrollIntoView({
            behavior:
              "smooth"
          });

        }
      );

    }
  );


/* =========================================================
   SHARE
   ========================================================= */

async function sharePost(
  postId
) {

  const shareData = {

    title:
      "Zinko post",

    text:
      "Check out this post on Zinko.",

    url:
      window.location.href +
      "?post=" +
      encodeURIComponent(
        postId
      )

  };


  try {

    if (
      navigator.share
    ) {

      await navigator.share(
        shareData
      );

    } else {

      await navigator.clipboard.writeText(
        shareData.url
      );


      alert(
        "Post link copied."
      );

    }

  } catch (error) {

    console.log(
      "Share cancelled."
    );

  }

}


/* =========================================================
   PAGE CLICK EVENTS
   ========================================================= */

postList.addEventListener(
  "click",
  async event => {

    /* ==============================================
       LIKE
       ============================================== */

    const likeButton =
      event.target.closest(
        ".like-button"
      );


    if (likeButton) {

      await toggleLike(
        likeButton.dataset.postId,
        likeButton
      );


      return;

    }


    /* ==============================================
       COMMENT TOGGLE
       ============================================== */

    const commentToggle =
      event.target.closest(
        ".comment-toggle"
      );


    if (commentToggle) {

      const postId =
        commentToggle.dataset.postId;


      const commentsSection =
        document.getElementById(
          `comments-${postId}`
        );


      if (!commentsSection) {

        return;

      }


      const currentlyHidden =
        commentsSection.style.display ===
        "none";


      commentsSection.style.display =
        currentlyHidden
          ? "block"
          : "none";


      if (currentlyHidden) {

        const input =
          commentsSection.querySelector(
            ".comment-input"
          );


        if (input) {

          setTimeout(
            () =>
              input.focus(),
            100
          );

        }

      }


      return;

    }


    /* ==============================================
       SEND COMMENT
       ============================================== */

    const commentButton =
      event.target.closest(
        ".comment-send"
      );


    if (commentButton) {

      const article =
        commentButton.closest(
          ".post"
        );


      await addComment(
        commentButton.dataset.postId,
        article
      );


      return;

    }


    /* ==============================================
       DELETE COMMENT
       ============================================== */

    const deleteButton =
      event.target.closest(
        ".comment-delete"
      );


    if (deleteButton) {

      const commentElement =
        deleteButton.closest(
          ".comment"
        );


      await deleteComment(
        deleteButton.dataset.commentId,
        deleteButton.dataset.postId,
        commentElement
      );


      return;

    }


    /* ==============================================
       SHARE
       ============================================== */

    const shareButton =
      event.target.closest(
        ".share-button"
      );


    if (shareButton) {

      await sharePost(
        shareButton
          .dataset
          .postId
      );


      return;

    }

  }
);


/* =========================================================
   ENTER TO SEND COMMENT
   ========================================================= */

postList.addEventListener(
  "keydown",
  event => {

    if (
      event.key !== "Enter" ||
      event.shiftKey
    ) {

      return;

    }


    const input =
      event.target.closest(
        ".comment-input"
      );


    if (!input) {

      return;

    }


    event.preventDefault();


    const article =
      input.closest(
        ".post"
      );


    const button =
      article.querySelector(
        ".comment-send"
      );


    if (button) {

      button.click();

    }

  }
);


/* =========================================================
   START ZINKO DISCOVER
   ========================================================= */

loadPosts();

</script>
