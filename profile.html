<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Profile — Zinko</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    .profile{
      padding-bottom:100px;
    }

    .profile-top{
      text-align:center;
      padding:25px 16px 10px;
    }

    /* =========================
       AVATAR
    ========================= */

    .avatar-wrap{
      position:relative;
      width:116px;
      height:116px;
      margin:0 auto 14px;
      padding:5px;
      border-radius:50%;

      background:
        conic-gradient(
          from 0deg,
          #7155ff,
          #10bce4,
          #9b5cff,
          #ffd34d,
          #7155ff
        );

      box-shadow:
        0 0 0 4px rgba(113,85,255,.12),
        0 0 25px rgba(16,188,228,.25);

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .avatar-wrap.verified{
      padding:6px;

      background:
        conic-gradient(
          from 0deg,
          #ffd34d,
          #ff8a00,
          #fff6b0,
          #ffb300,
          #ffe16b,
          #ff8a00,
          #ffd34d
        );

      box-shadow:
        0 0 0 4px rgba(255,211,77,.15),
        0 0 18px rgba(255,179,0,.30),
        0 0 38px rgba(255,179,0,.25);
    }

    .avatar-wrap.verified::before{
      content:"";
      position:absolute;
      inset:-5px;
      border-radius:50%;
      border:2px dashed rgba(255,211,77,.75);
      pointer-events:none;
    }

    .avatar-wrap.verified::after{
      content:"✦";
      position:absolute;
      right:-2px;
      bottom:2px;
      width:28px;
      height:28px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(
          135deg,
          #fff4a3,
          #ffc107,
          #ff8a00
        );

      color:#382300;
      font-size:15px;
      font-weight:900;

      border:3px solid #0b1120;

      box-shadow:
        0 4px 12px rgba(255,174,0,.40);
    }

    .profile-avatar{
      width:100%;
      height:100%;
      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(
          135deg,
          #171d35,
          #0b1120
        );

      color:white;
      font-size:42px;
      font-weight:900;

      overflow:hidden;
    }

    .profile-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* =========================
       AVATAR EDIT BUTTON
    ========================= */

    .avatar-edit-button{
      position:absolute;
      right:-3px;
      bottom:-3px;

      width:38px;
      height:38px;

      border-radius:50%;

      border:3px solid #0b1120;

      background:
        linear-gradient(
          135deg,
          #7155ff,
          #10bce4
        );

      color:white;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:17px;
      cursor:pointer;

      box-shadow:
        0 5px 15px rgba(0,0,0,.35);

      z-index:5;
    }

    .avatar-edit-button:active{
      transform:scale(.94);
    }

    #avatarInput{
      display:none;
    }

    .avatar-upload-message{
      margin:8px auto 0;
      max-width:350px;
      min-height:18px;

      color:#aeb5cb;
      font-size:12px;
    }

    .avatar-upload-message.success{
      color:#63e6be;
    }

    .avatar-upload-message.error{
      color:#ff7d96;
    }

    .avatar-upload-message.loading{
      color:#61d8ff;
    }

    .verified-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      margin-left:6px;

      width:23px;
      height:23px;

      border-radius:50%;

      background:
        linear-gradient(
          135deg,
          #ffd34d,
          #ff9d00
        );

      color:#241500;

      font-size:13px;
      font-weight:900;

      vertical-align:middle;

      box-shadow:
        0 2px 8px rgba(255,174,0,.35);
    }

    .verified-profile-label{
      display:inline-flex;
      align-items:center;
      gap:5px;

      margin-top:7px;
      padding:5px 10px;

      border-radius:20px;

      background:rgba(255,211,77,.08);
      border:1px solid rgba(255,211,77,.20);

      color:#ffd34d;

      font-size:11px;
      font-weight:700;
    }

    .profile-name{
      margin:8px 0 4px;
      font-size:24px;
    }

    .handle{
      color:#9da6bf;
      margin:0;
    }

    .bio{
      max-width:500px;
      margin:12px auto;
      color:#d8dced;
      line-height:1.5;
    }

    /* =========================
       PROFILE STATS
    ========================= */

    .stats{
      display:flex;
      justify-content:center;
      gap:20px;

      margin:20px 0;

      flex-wrap:wrap;
    }

    .stats div{
      text-align:center;
      min-width:62px;
    }

    .stats b{
      display:block;
      font-size:19px;
    }

    .stats small{
      color:#8f98b0;
      font-size:12px;
    }

    .stat-likes{
      color:#ff6b91;
    }

    .stat-views{
      color:#61d8ff;
    }

    /* =========================
       EDIT
    ========================= */

    .edit-panel{
      margin:18px 16px;
      padding:16px;

      background:#101728;
      border:1px solid #202840;

      border-radius:18px;
    }

    .edit-panel input,
    .edit-panel textarea{
      width:100%;
      margin-bottom:10px;

      background:#0b1120;
      color:white;

      border:1px solid #29314b;
      border-radius:12px;

      padding:12px;
      outline:none;
      font-family:inherit;

      box-sizing:border-box;
    }

    .edit-panel textarea{
      resize:vertical;
    }

    .profile-actions{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    /* =========================
       TABS
    ========================= */

    .profile-tabs{
      display:flex;
      margin-top:25px;
      border-bottom:1px solid #202840;
    }

    .profile-tabs button{
      flex:1;

      border:0;
      background:transparent;

      color:#777f98;

      padding:14px 5px;

      cursor:pointer;

      font-weight:bold;
    }

    .profile-tabs button.active{
      color:white;
      border-bottom:2px solid #7155ff;
    }

    /* =========================
       CONTENT
    ========================= */

    #profileContent{
      padding:15px;
    }

    .content-card{
      background:#101728;
      border:1px solid #202840;

      border-radius:18px;

      padding:14px;
      margin-bottom:12px;
    }

    .content-date{
      color:#858da6;
      font-size:12px;
      margin-bottom:8px;
    }

    .content-text{
      line-height:1.5;
      word-break:break-word;
    }

    .content-media{
      margin-top:10px;
    }

    .content-media img,
    .content-media video{
      width:100%;
      max-height:500px;
      object-fit:cover;
      border-radius:14px;
      display:block;
    }

    .content-media video{
      background:#000;
    }

    /* =========================
       POST INFORMATION
    ========================= */

    .post-stats{
      display:flex;
      align-items:center;
      gap:18px;

      margin-top:12px;
      padding-top:10px;

      border-top:1px solid #202840;

      color:#9da6bf;
      font-size:13px;
    }

    .post-stat{
      display:flex;
      align-items:center;
      gap:5px;
    }

    .post-stat.like{
      color:#ff6b91;
    }

    .post-stat.view{
      color:#61d8ff;
    }

    .post-stat.comment{
      color:#b8a6ff;
    }

    .empty{
      text-align:center;
      padding:35px 15px;
      color:#858da6;
    }

    .message{
      text-align:center;
      margin-top:10px;
      color:#aeb5cb;
      font-size:13px;
    }

    .private-label{
      text-align:center;
      margin-bottom:15px;
      color:#8f98b0;
      font-size:12px;
    }

    .loading{
      text-align:center;
      padding:35px;
      color:#8f98b0;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:480px){

      .stats{
        gap:10px;
      }

      .stats div{
        min-width:58px;
      }

      .stats b{
        font-size:17px;
      }

      .stats small{
        font-size:11px;
      }

      .post-stats{
        gap:12px;
        font-size:12px;
      }

    }

  </style>

</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================= -->

  <header class="top">

    <div class="wordmark">
      <span>Z</span>Profile
    </div>

    <a href="settings.html">⚙</a>

  </header>


  <!-- =========================
       PROFILE
  ========================= -->

  <main class="profile">

    <section class="profile-top">

      <!-- =========================
           AVATAR
      ========================= -->

      <div
        id="avatarWrap"
        class="avatar-wrap"
      >

        <div
          class="profile-avatar"
          id="profileAvatar"
        >
          S
        </div>

        <button
          type="button"
          id="avatarEditButton"
          class="avatar-edit-button"
          title="Change profile picture"
          aria-label="Change profile picture"
        >
          📷
        </button>

        <input
          id="avatarInput"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
        >

      </div>

      <p
        id="avatarUploadMessage"
        class="avatar-upload-message"
      ></p>


      <h2
        id="profileName"
        class="profile-name"
      >
        Loading...
      </h2>


      <p
        class="handle"
        id="profileHandle"
      >
        @username · Creator
      </p>


      <div
        id="verifiedText"
        class="verified-profile-label"
        style="display:none;"
      >
        ✦ Zinko Verified
      </div>


      <p
        class="bio"
        id="profileBio"
      >
        Welcome to my Zinko world. 🌍
      </p>


      <!-- =========================
           STATS
      ========================= -->

      <div class="stats">

        <div>
          <b id="postsCount">0</b>
          <small>Posts</small>
        </div>

        <div>
          <b id="followersCount">0</b>
          <small>Followers</small>
        </div>

        <div>
          <b id="followingCount">0</b>
          <small>Following</small>
        </div>

        <div>
          <b
            id="likesReceivedCount"
            class="stat-likes"
          >
            0
          </b>
          <small>Likes</small>
        </div>

        <div>
          <b
            id="viewsReceivedCount"
            class="stat-views"
          >
            0
          </b>
          <small>Views</small>
        </div>

      </div>


      <div class="profile-actions">

        <button
          class="btn primary"
          id="editProfileButton"
          type="button"
        >
          Edit Profile
        </button>

      </div>

    </section>


    <!-- =========================
         EDIT PROFILE
    ========================= -->

    <section
      id="editPanel"
      class="edit-panel"
      style="display:none;"
    >

      <input
        id="editName"
        type="text"
        placeholder="Full name"
      >

      <input
        id="editUsername"
        type="text"
        placeholder="Username"
      >

      <input
        id="editCountry"
        type="text"
        placeholder="Country"
      >

      <textarea
        id="editBio"
        placeholder="Bio"
        rows="4"
      ></textarea>


      <button
        class="btn primary full"
        id="saveProfile"
        type="button"
      >
        Save Profile
      </button>


      <button
        class="btn glass full"
        id="cancelEdit"
        type="button"
      >
        Cancel
      </button>


      <p
        id="profileMessage"
        class="message"
      ></p>

    </section>


    <!-- =========================
         TABS
    ========================= -->

    <div class="profile-tabs">

      <button
        id="postsTab"
        class="active"
        type="button"
      >
        Posts
      </button>

      <button
        id="videosTab"
        type="button"
      >
        Videos
      </button>

      <button
        id="likesTab"
        type="button"
      >
        Likes
      </button>

    </div>


    <div id="profileContent">

      <div class="loading">
        Loading...
      </div>

    </div>

  </main>


  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav class="nav">

    <a href="home.html">
      ⌂
      <small>Home</small>
    </a>

    <a href="live.html">
      ◉
      <small>Live</small>
    </a>

    <a href="discover.html">
      ⌕
      <small>Discover</small>
    </a>

    <a href="messages.html">
      ✉
      <small>Messages</small>
    </a>

    <a
      class="active"
      href="profile.html"
    >
      ●
      <small>Profile</small>
    </a>

  </nav>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://ggqhwoyzuypryocrxiru.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_RIB0a5lVDxK8iqvTB1lr8A_JLnaMvF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const avatarWrap =
  document.getElementById("avatarWrap");

const profileAvatar =
  document.getElementById("profileAvatar");

const avatarEditButton =
  document.getElementById("avatarEditButton");

const avatarInput =
  document.getElementById("avatarInput");

const avatarUploadMessage =
  document.getElementById(
    "avatarUploadMessage"
  );

const profileName =
  document.getElementById("profileName");

const profileHandle =
  document.getElementById("profileHandle");

const profileBio =
  document.getElementById("profileBio");

const verifiedText =
  document.getElementById("verifiedText");

const postsCount =
  document.getElementById("postsCount");

const followersCount =
  document.getElementById("followersCount");

const followingCount =
  document.getElementById("followingCount");

const likesReceivedCount =
  document.getElementById(
    "likesReceivedCount"
  );

const viewsReceivedCount =
  document.getElementById(
    "viewsReceivedCount"
  );

const editButton =
  document.getElementById(
    "editProfileButton"
  );

const editPanel =
  document.getElementById(
    "editPanel"
  );

const saveButton =
  document.getElementById(
    "saveProfile"
  );

const cancelButton =
  document.getElementById(
    "cancelEdit"
  );

const profileMessage =
  document.getElementById(
    "profileMessage"
  );

const postsTab =
  document.getElementById(
    "postsTab"
  );

const videosTab =
  document.getElementById(
    "videosTab"
  );

const likesTab =
  document.getElementById(
    "likesTab"
  );

const profileContent =
  document.getElementById(
    "profileContent"
  );


let currentUser = null;

let currentUserVerified = false;


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if(
    error ||
    !data ||
    !data.user
  ){

    window.location.href =
      "login.html";

    return null;

  }


  currentUser =
    data.user;

  return currentUser;

}


/* =========================================
   CHECK VERIFICATION
========================================= */

async function checkZinkoVerification(
  userId
){

  if(!userId){
    return false;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("zinko_verifications")
    .select("verified")
    .eq(
      "user_id",
      userId
    )
    .eq(
      "verified",
      true
    )
    .maybeSingle();


  if(error){

    console.error(
      "Verification error:",
      error
    );

    return false;

  }


  return !!data;

}


/* =========================================
   APPLY VERIFICATION
========================================= */

function applyVerification(
  verified,
  name
){

  currentUserVerified =
    verified;


  if(verified){

    avatarWrap.classList.add(
      "verified"
    );


    verifiedText.style.display =
      "inline-flex";


    profileName.innerHTML =
      escapeHTML(name) +
      `
        <span
          class="verified-badge"
          title="Zinko Verified"
        >
          ✓
        </span>
      `;

  }

  else{

    avatarWrap.classList.remove(
      "verified"
    );


    verifiedText.style.display =
      "none";


    profileName.textContent =
      name;

  }

}


/* =========================================
   DISPLAY AVATAR
========================================= */

function displayAvatar(
  avatarUrl,
  name
){

  profileAvatar.innerHTML =
    "";


  if(avatarUrl){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      avatarUrl;

    img.alt =
      "Profile picture";

    img.loading =
      "eager";

    img.onerror =
      function(){

        profileAvatar.textContent =
          (name || "Z")
            .charAt(0)
            .toUpperCase();

      };


    profileAvatar.appendChild(
      img
    );

  }

  else{

    profileAvatar.textContent =
      (name || "Z")
        .charAt(0)
        .toUpperCase();

  }

}


/* =========================================
   AVATAR MESSAGE
========================================= */

function setAvatarMessage(
  message,
  type
){

  avatarUploadMessage.textContent =
    message || "";

  avatarUploadMessage.className =
    "avatar-upload-message";

  if(type){

    avatarUploadMessage.classList.add(
      type
    );

  }

}


/* =========================================
   DELETE OLD AVATAR
========================================= */

async function deleteOldAvatar(
  avatarUrl
){

  if(!avatarUrl){
    return;
  }


  try{

    const marker =
      "/storage/v1/object/public/avatars/";

    const index =
      avatarUrl.indexOf(marker);


    if(index === -1){
      return;
    }


    const filePath =
      decodeURIComponent(
        avatarUrl.substring(
          index + marker.length
        )
      );


    if(!filePath){
      return;
    }


    const {
      error
    } =
    await supabaseClient
      .storage
      .from("avatars")
      .remove([
        filePath
      ]);


    if(error){

      console.warn(
        "Old avatar could not be deleted:",
        error
      );

    }

  }
  catch(error){

    console.warn(
      "Old avatar deletion error:",
      error
    );

  }

}


/* =========================================
   UPLOAD AVATAR
========================================= */

async function uploadAvatar(
  file
){

  if(!currentUser){

    setAvatarMessage(
      "You must be logged in to change your picture.",
      "error"
    );

    return;

  }


  if(!file){

    return;

  }


  /* =========================
     CHECK FILE TYPE
  ========================= */

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];


  if(
    !allowedTypes.includes(
      file.type
    )
  ){

    setAvatarMessage(
      "Please choose a JPG, PNG, WEBP, or GIF image.",
      "error"
    );

    avatarInput.value =
      "";

    return;

  }


  /* =========================
     CHECK FILE SIZE
  ========================= */

  const maxSize =
    5 * 1024 * 1024;


  if(
    file.size > maxSize
  ){

    setAvatarMessage(
      "Your profile picture must be 5 MB or smaller.",
      "error"
    );

    avatarInput.value =
      "";

    return;

  }


  setAvatarMessage(
    "Uploading profile picture...",
    "loading"
  );


  avatarEditButton.disabled =
    true;


  const oldAvatarUrl =
    currentUser.user_metadata?.avatar_url ||
    null;


  try{

    /* =========================
       CREATE UNIQUE FILE NAME
    ========================= */

    const extension =
      (
        file.name.split(".").pop() ||
        "jpg"
      )
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ""
      );


    const filePath =
      currentUser.id +
      "/avatar-" +
      Date.now() +
      "." +
      extension;


    /* =========================
       UPLOAD
    ========================= */

    const {
      error: uploadError
    } =
    await supabaseClient
      .storage
      .from("avatars")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );


    if(uploadError){

      throw uploadError;

    }


    /* =========================
       GET PUBLIC URL
    ========================= */

    const {
      data: publicUrlData
    } =
    supabaseClient
      .storage
      .from("avatars")
      .getPublicUrl(
        filePath
      );


    const avatarUrl =
      publicUrlData?.publicUrl;


    if(!avatarUrl){

      throw new Error(
        "Could not create the avatar URL."
      );

    }


    /* =========================
       SAVE URL TO USER PROFILE
    ========================= */

    const {
      data: updatedUser,
      error: updateError
    } =
    await supabaseClient.auth.updateUser({

      data:{
        avatar_url:
          avatarUrl
      }

    });


    if(updateError){

      /* Remove uploaded file if profile update fails */

      await supabaseClient
        .storage
        .from("avatars")
        .remove([
          filePath
        ]);

      throw updateError;

    }


    /* =========================
       UPDATE LOCAL USER
    ========================= */

    if(
      updatedUser &&
      updatedUser.user
    ){

      currentUser =
        updatedUser.user;

    }
    else{

      currentUser.user_metadata =
        {
          ...(
            currentUser.user_metadata ||
            {}
          ),
          avatar_url:
            avatarUrl
        };

    }


    /* =========================
       SHOW NEW AVATAR
    ========================= */

    displayAvatar(
      avatarUrl,
      currentUser.user_metadata?.full_name ||
      "Zinko User"
    );


    setAvatarMessage(
      "Profile picture updated successfully!",
      "success"
    );


    /* =========================
       DELETE OLD AVATAR
    ========================= */

    if(
      oldAvatarUrl &&
      oldAvatarUrl !== avatarUrl
    ){

      await deleteOldAvatar(
        oldAvatarUrl
      );

    }


  }
  catch(error){

    console.error(
      "Avatar upload error:",
      error
    );


    setAvatarMessage(
      error?.message ||
      "Unable to upload your profile picture.",
      "error"
    );

  }
  finally{

    avatarEditButton.disabled =
      false;

    avatarInput.value =
      "";

  }

}

    metadata.full_name ||

    metadata.country ||
    "";

/* =========================================
   RENDER POSTS
========================================= */

async function renderPosts(
  posts
){

  profileContent.innerHTML =
    "";


  for(
    const post of posts
  ){

    const card =
      document.createElement(
        "article"
      );


    card.className =
      "content-card";


    let media =
      "";


    /* VIDEO */

    if(
      post.video_url
    ){

      media =
        `
          <div class="content-media">

            <video
              src="${escapeAttribute(post.video_url)}"
              controls
              playsinline
              preload="metadata"
            ></video>

          </div>
        `;

    }


    /* IMAGE */

    else if(
      post.image_url
    ){

      media =
        `
          <div class="content-media">

            <img
              src="${escapeAttribute(post.image_url)}"
              alt="Post"
            >

          </div>
        `;

    }


    /* =========================
       GET LIKE COUNT
    ========================= */

    let likeCount =
      0;


    try{

      const {
        count,
        error
      } =
      await supabaseClient
        .from("post_likes")
        .select(
          "*",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "post_id",
          post.id
        );


      if(!error){

        likeCount =
          count || 0;

      }

    }
    catch(error){

      console.log(
        "Like count error:",
        error
      );

    }


    /* =========================
       GET VIEW COUNT
    ========================= */

    let viewCount =
      0;


    try{

      const {
        count,
        error
      } =
      await supabaseClient
        .from("post_viewers")
        .select(
          "*",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "post_id",
          post.id
        );


      if(!error){

        viewCount =
          count || 0;

      }

    }
    catch(error){

      console.log(
        "View count error:",
        error
      );

    }


    /* =========================
       COMMENT COUNT
    ========================= */

    let commentCount =
      0;


    try{

      const {
        count,
        error
      } =
      await supabaseClient
        .from("comments")
        .select(
          "*",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "post_id",
          post.id
        );


      if(!error){

        commentCount =
          count || 0;

      }

    }
    catch(error){

      commentCount =
        0;

    }


    card.innerHTML =
      `
        <div class="content-date">
          ${formatDate(post.created_at)}
        </div>

        ${
          post.content
            ? `
              <div class="content-text">
                ${escapeHTML(post.content)}
              </div>
            `
            : ""
        }

        ${media}

        <div class="post-stats">

          <div class="post-stat like">
            ❤️
            <span>
              ${formatNumber(likeCount)}
            </span>
            Likes
          </div>

          <div class="post-stat view">
            👁
            <span>
              ${formatNumber(viewCount)}
            </span>
            Views
          </div>

          <div class="post-stat comment">
            💬
            <span>
              ${formatNumber(commentCount)}
            </span>
            Comments
          </div>

        </div>
      `;


    profileContent.appendChild(
      card
    );

  }

}

          🔒 Only you can see your liked content.
        </div>
      `;

  const {
    data: posts,

  } =
  await supabaseClient
    .from("posts")
    .select("*")
    .in(
      "id",
      postIds
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(postError){

    console.error(
      "Liked posts error:",
      postError
    );


    profileContent.innerHTML =
      `
        <div class="empty">

/* =========================================
   NUMBER FORMAT
========================================= */

function formatNumber(
  number
){

  const value =
    Number(number) || 0;


  if(value >= 1000000000){

    return (
      value / 1000000000
    ).toFixed(1) + "B";

  }


  if(value >= 1000000){

    return (
      value / 1000000
    ).toFixed(1) + "M";

  }


  if(value >= 1000){

    return (
      value / 1000
    ).toFixed(1) + "K";

  }


  return String(value);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  text
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text || "";


  return div.innerHTML;

}


/* =========================================
   ESCAPE ATTRIBUTE
========================================= */

function escapeAttribute(
  text
){

  return String(
    text || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


/* =========================================
   DATE
========================================= */

function formatDate(
  value
){

  if(!value){
    return "";
  }


  return new Date(
    value
  ).toLocaleString();

}
