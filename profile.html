<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Profile — Zinko</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    .profile {
      padding-bottom: 100px;
    }

    .profile-top {
      text-align: center;
      padding: 25px 16px 10px;
    }

    /* =========================
       ZINKO PROFILE AVATAR
    ========================= */

    .avatar-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      margin: 0 auto 14px;
      padding: 5px;
      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          #7155ff,
          #10bce4,
          #9b5cff,
          #ffd34d,
          #7155ff
        );

      box-shadow:
        0 0 0 4px rgba(113,85,255,.12),
        0 0 25px rgba(16,188,228,.25);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* VERIFIED ZINKO DESIGN */

    .avatar-wrap.verified {
      padding: 6px;

      background:
        conic-gradient(
          from 0deg,
          #ffd34d,
          #ff8a00,
          #fff6b0,
          #ffb300,
          #ffe16b,
          #ff8a00,
          #ffd34d
        );

      box-shadow:
        0 0 0 4px rgba(255,211,77,.15),
        0 0 18px rgba(255,179,0,.30),
        0 0 38px rgba(255,179,0,.25);
    }

    .avatar-wrap.verified::before {
      content: "";
      position: absolute;
      inset: -5px;

      border-radius: 50%;

      border: 2px dashed rgba(255,211,77,.75);

      pointer-events: none;
    }

    .avatar-wrap.verified::after {
      content: "✦";

      position: absolute;

      right: -2px;
      bottom: 2px;

      width: 28px;
      height: 28px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #fff4a3,
          #ffc107,
          #ff8a00
        );

      color: #382300;

      font-size: 15px;
      font-weight: 900;

      border: 3px solid #0b1120;

      box-shadow:
        0 4px 12px rgba(255,174,0,.40);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #171d35,
          #0b1120
        );

      color: white;
      font-size: 42px;
      font-weight: 900;

      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-left: 6px;

      width: 23px;
      height: 23px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #ffd34d,
          #ff9d00
        );

      color: #241500;

      font-size: 13px;
      font-weight: 900;

      vertical-align: middle;

      box-shadow:
        0 2px 8px rgba(255,174,0,.35);
    }

    .verified-text {
      margin-top: 6px;

      color: #ffd34d;

      font-size: 12px;
      font-weight: 700;
    }

    .profile-name {
      margin: 8px 0 4px;
      font-size: 24px;
    }

    .handle {
      color: #9da6bf;
      margin: 0;
    }

    .bio {
      max-width: 500px;
      margin: 12px auto;
      color: #d8dced;
      line-height: 1.5;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: flex;
      justify-content: center;
      gap: 45px;

      margin: 20px 0;
    }

    .stats div {
      text-align: center;
    }

    .stats b {
      display: block;
      font-size: 19px;
    }

    .stats small {
      color: #8f98b0;
      font-size: 12px;
    }

    /* =========================
       EDIT
    ========================= */

    .edit-panel {
      margin: 18px 16px;
      padding: 16px;

      background: #101728;
      border: 1px solid #202840;

      border-radius: 18px;
    }

    .edit-panel input,
    .edit-panel textarea {
      width: 100%;
      margin-bottom: 10px;

      background: #0b1120;
      color: white;

      border: 1px solid #29314b;
      border-radius: 12px;

      padding: 12px;
      outline: none;
      font-family: inherit;

      box-sizing: border-box;
    }

    .edit-panel textarea {
      resize: vertical;
    }

    .profile-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* =========================
       TABS
    ========================= */

    .profile-tabs {
      display: flex;

      margin-top: 25px;

      border-bottom: 1px solid #202840;
    }

    .profile-tabs button {
      flex: 1;

      border: 0;
      background: transparent;

      color: #777f98;

      padding: 14px 5px;

      cursor: pointer;

      font-weight: bold;
    }

    .profile-tabs button.active {
      color: white;

      border-bottom:
        2px solid #7155ff;
    }

    /* =========================
       CONTENT
    ========================= */

    #profileContent {
      padding: 15px;
    }

    .content-card {
      background: #101728;
      border: 1px solid #202840;

      border-radius: 18px;

      padding: 14px;
      margin-bottom: 12px;
    }

    .content-date {
      color: #858da6;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .content-text {
      line-height: 1.5;
      word-break: break-word;
    }

    .content-media {
      margin-top: 10px;
    }

    .content-media img,
    .content-media video {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    .content-media video {
      background: #000;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #858da6;
    }

    .message {
      text-align: center;
      margin-top: 10px;
      color: #aeb5cb;
      font-size: 13px;
    }

    .private-label {
      text-align: center;
      margin-bottom: 15px;
      color: #8f98b0;
      font-size: 12px;
    }

    .verified-profile-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      margin-top: 7px;
      padding: 5px 10px;

      border-radius: 20px;

      background: rgba(255,211,77,.08);
      border: 1px solid rgba(255,211,77,.20);

      color: #ffd34d;

      font-size: 11px;
      font-weight: 700;
    }

  </style>

</head>

<body>

<div class="app">

  <header class="top">

    <div class="wordmark">
      <span>Z</span>Profile
    </div>

    <a href="settings.html">⚙</a>

  </header>


  <main class="profile">

    <!-- PROFILE HEADER -->

    <section class="profile-top">

      <div
        id="avatarWrap"
        class="avatar-wrap"
      >

        <div
          class="profile-avatar"
          id="profileAvatar"
        >
          S
        </div>

      </div>


      <h2
        id="profileName"
        class="profile-name"
      >
        Loading...
      </h2>


      <p
        class="handle"
        id="profileHandle"
      >
        @username · Creator
      </p>


      <div
        id="verifiedText"
        class="verified-profile-label"
        style="display:none;"
      >
        ✦ Zinko Verified
      </div>


      <p
        class="bio"
        id="profileBio"
      >
        Welcome to my Zinko world. 🌍
      </p>


      <div class="stats">

        <div>
          <b id="postsCount">0</b>
          <small>Posts</small>
        </div>

        <div>
          <b id="followersCount">0</b>
          <small>Followers</small>
        </div>

        <div>
          <b id="followingCount">0</b>
          <small>Following</small>
        </div>

      </div>


      <div class="profile-actions">

        <button
          class="btn primary"
          id="editProfileButton"
          type="button"
        >
          Edit Profile
        </button>

      </div>

    </section>


    <!-- EDIT PROFILE -->

    <section
      id="editPanel"
      class="edit-panel"
      style="display:none;"
    >

      <input
        id="editName"
        type="text"
        placeholder="Full name"
      >

      <input
        id="editUsername"
        type="text"
        placeholder="Username"
      >

      <input
        id="editCountry"
        type="text"
        placeholder="Country"
      >

      <textarea
        id="editBio"
        placeholder="Bio"
        rows="4"
      ></textarea>


      <button
        class="btn primary full"
        id="saveProfile"
        type="button"
      >
        Save Profile
      </button>


      <button
        class="btn glass full"
        id="cancelEdit"
        type="button"
      >
        Cancel
      </button>


      <p
        id="profileMessage"
        class="message"
      ></p>

    </section>


    <!-- PROFILE TABS -->

    <div class="profile-tabs">

      <button
        id="postsTab"
        class="active"
        type="button"
      >
        Posts
      </button>

      <button
        id="videosTab"
        type="button"
      >
        Videos
      </button>

      <button
        id="likesTab"
        type="button"
      >
        Likes
      </button>

    </div>


    <div id="profileContent">
      Loading...
    </div>

  </main>


  <!-- NAVIGATION -->

  <nav class="nav">

    <a href="home.html">
      ⌂
      <small>Home</small>
    </a>

    <a href="live.html">
      ◉
      <small>Live</small>
    </a>

    <a href="discover.html">
      ⌕
      <small>Discover</small>
    </a>

    <a href="messages.html">
      ✉
      <small>Messages</small>
    </a>

    <a
      class="active"
      href="profile.html"
    >
      ●
      <small>Profile</small>
    </a>

  </nav>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://ggqhwoyzuypryocrxiru.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_RIB0a5lVDxK8iqvTB1lr8A_JLnaMvF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const avatarWrap =
  document.getElementById("avatarWrap");

const profileAvatar =
  document.getElementById("profileAvatar");

const profileName =
  document.getElementById("profileName");

const profileHandle =
  document.getElementById("profileHandle");

const profileBio =
  document.getElementById("profileBio");

const verifiedText =
  document.getElementById("verifiedText");

const postsCount =
  document.getElementById("postsCount");

const followersCount =
  document.getElementById("followersCount");

const followingCount =
  document.getElementById("followingCount");

const editButton =
  document.getElementById("editProfileButton");

const editPanel =
  document.getElementById("editPanel");

const saveButton =
  document.getElementById("saveProfile");

const cancelButton =
  document.getElementById("cancelEdit");

const profileMessage =
  document.getElementById("profileMessage");

const postsTab =
  document.getElementById("postsTab");

const videosTab =
  document.getElementById("videosTab");

const likesTab =
  document.getElementById("likesTab");

const profileContent =
  document.getElementById("profileContent");


let currentUser = null;

let currentUserVerified = false;


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if (
    error ||
    !data ||
    !data.user
  ) {

    window.location.href =
      "login.html";

    return null;

  }


  currentUser =
    data.user;

  return currentUser;

}


/* =========================================
   CHECK ZINKO VERIFICATION
========================================= */

async function checkZinkoVerification(
  userId
) {

  if (!userId) {
    return false;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("zinko_verifications")
    .select(
      "verified"
    )
    .eq(
      "user_id",
      userId
    )
    .eq(
      "verified",
      true
    )
    .maybeSingle();


  if (error) {

    console.error(
      "Verification check error:",
      error
    );

    return false;

  }


  return !!data;

}


/* =========================================
   APPLY VERIFIED DESIGN
========================================= */

function applyVerification(
  verified,
  name
) {

  currentUserVerified =
    verified;


  if (verified) {

    avatarWrap.classList.add(
      "verified"
    );


    verifiedText.style.display =
      "inline-flex";


    profileName.innerHTML =
      escapeHTML(name) +
      `
        <span
          class="verified-badge"
          title="Zinko Verified"
        >
          ✓
        </span>
      `;

  }

  else {

    avatarWrap.classList.remove(
      "verified"
    );


    verifiedText.style.display =
      "none";


    profileName.textContent =
      name;

  }

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {

  const user =
    await getCurrentUser();


  if (!user) {
    return;
  }


  const metadata =
    user.user_metadata || {};


  const name =
    metadata.full_name ||
    "Zinko User";


  const username =
    metadata.username ||
    "username";


  const country =
    metadata.country ||
    "";


  const bio =
    metadata.bio ||
    "Welcome to my Zinko world. 🌍";


  profileName.textContent =
    name;


  profileHandle.textContent =
    "@" +
    username +
    " · Creator";


  profileBio.textContent =
    bio;


  profileAvatar.textContent =
    name
      .charAt(0)
      .toUpperCase();


  document.getElementById(
    "editName"
  ).value = name;


  document.getElementById(
    "editUsername"
  ).value = username;


  document.getElementById(
    "editCountry"
  ).value = country;


  document.getElementById(
    "editBio"
  ).value = bio;


  /* CHECK VERIFIED STATUS */

  const verified =
    await checkZinkoVerification(
      user.id
    );


  applyVerification(
    verified,
    name
  );


  await loadProfileStats();

  await loadPosts();

}


/* =========================================
   PROFILE STATS
========================================= */

async function loadProfileStats() {

  if (!currentUser) {
    return;
  }


  /* POSTS */

  const {
    count: postCount,
    error: postError
  } =
  await supabaseClient
    .from("posts")
    .select(
      "*",
      {
        count: "exact",
        head: true
      }
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if (!postError) {

    postsCount.textContent =
      postCount || 0;

  }


  /* FOLLOWERS / FOLLOWING */

  try {

    const {
      count: followers,
      error: followerError
    } =
    await supabaseClient
      .from("follows")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "following_id",
        currentUser.id
      );


    if (!followerError) {

      followersCount.textContent =
        followers || 0;

    }


    const {
      count: following,
      error: followingError
    } =
    await supabaseClient
      .from("follows")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "follower_id",
        currentUser.id
      );


    if (!followingError) {

      followingCount.textContent =
        following || 0;

    }

  }

  catch (error) {

    console.log(
      "Follow system not available yet."
    );

  }

}


/* =========================================
   EDIT PROFILE
========================================= */

editButton.addEventListener(
  "click",
  () => {

    editPanel.style.display =
      "block";

    editButton.style.display =
      "none";

  }
);


cancelButton.addEventListener(
  "click",
  () => {

    editPanel.style.display =
      "none";

    editButton.style.display =
      "inline-block";

    profileMessage.textContent =
      "";

  }
);


/* =========================================
   SAVE PROFILE
========================================= */

saveButton.addEventListener(
  "click",
  async () => {

    const name =
      document
        .getElementById("editName")
        .value
        .trim();


    const username =
      document
        .getElementById("editUsername")
        .value
        .trim();


    const country =
      document
        .getElementById("editCountry")
        .value
        .trim();


    const bio =
      document
        .getElementById("editBio")
        .value
        .trim();


    if (
      !name ||
      !username
    ) {

      profileMessage.textContent =
        "Full name and username are required.";

      return;

    }


    saveButton.disabled =
      true;

    saveButton.textContent =
      "Saving...";


    const {
      error
    } =
    await supabaseClient.auth.updateUser({

      data: {

        full_name:
          name,

        username:
          username,

        country:
          country,

        bio:
          bio

      }

    });


    if (error) {

      profileMessage.textContent =
        error.message;

      saveButton.disabled =
        false;

      saveButton.textContent =
        "Save Profile";

      return;

    }


    profileMessage.textContent =
      "Profile updated successfully!";


    profileHandle.textContent =
      "@" +
      username +
      " · Creator";


    profileBio.textContent =
      bio;


    profileAvatar.textContent =
      name
        .charAt(0)
        .toUpperCase();


    applyVerification(
      currentUserVerified,
      name
    );


    saveButton.disabled =
      false;

    saveButton.textContent =
      "Save Profile";

  }
);


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts() {

  if (!currentUser) {
    return;
  }


  profileContent.innerHTML =
    `
      <div class="empty">
        Loading your posts...
      </div>
    `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .select("*")
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(
      "Posts error:",
      error
    );


    profileContent.innerHTML =
      `
        <div class="empty">
          Unable to load your posts.
        </div>
      `;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    profileContent.innerHTML =
      `
        <div class="empty">
          You haven't posted anything yet.
        </div>
      `;

    return;

  }


  renderPosts(data);

}


/* =========================================
   RENDER POSTS
   FIXED FOR YOUR DATABASE
========================================= */

function renderPosts(posts) {

  profileContent.innerHTML =
    "";


  posts.forEach(
    post => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "content-card";


      let media =
        "";


      /* =========================
         VIDEO
      ========================= */

      if (
        post.video_url
      ) {

        media =
          `
            <div class="content-media">

              <video
                src="${escapeAttribute(post.video_url)}"
                controls
                playsinline
                preload="metadata"
              ></video>

            </div>
          `;

      }


      /* =========================
         IMAGE
      ========================= */

      else if (
        post.image_url
      ) {

        media =
          `
            <div class="content-media">

              <img
                src="${escapeAttribute(post.image_url)}"
                alt="Post"
              >

            </div>
          `;

      }


      card.innerHTML =
        `
          <div class="content-date">
            ${formatDate(post.created_at)}
          </div>

          ${
            post.content
              ? `
                <div class="content-text">
                  ${escapeHTML(post.content)}
                </div>
              `
              : ""
          }

          ${media}
        `;


      profileContent.appendChild(
        card
      );

    }
  );

}


/* =========================================
   VIDEOS
   FIXED FOR video_url
========================================= */

async function loadVideos() {

  if (!currentUser) {
    return;
  }


  profileContent.innerHTML =
    `
      <div class="empty">
        Loading your videos...
      </div>
    `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .select("*")
    .eq(
      "user_id",
      currentUser.id
    )
    .not(
      "video_url",
      "is",
      null
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(
      "Videos error:",
      error
    );


    profileContent.innerHTML =
      `
        <div class="empty">
          Unable to load videos.
        </div>
      `;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    profileContent.innerHTML =
      `
        <div class="empty">
          You haven't posted any videos yet.
        </div>
      `;

    return;

  }


  renderPosts(data);

}


/* =========================================
   PRIVATE LIKES
========================================= */

async function loadLikes() {

  if (!currentUser) {
    return;
  }


  profileContent.innerHTML =
    `
      <div class="private-label">
        🔒 Only you can see the posts you have liked.
      </div>

      <div class="empty">
        Loading your likes...
      </div>
    `;


  const {
    data: likes,
    error: likeError
  } =
  await supabaseClient
    .from("post_likes")
    .select("post_id")
    .eq(
      "user_id",
      currentUser.id
    );


  if (likeError) {

    console.error(
      "Likes error:",
      likeError
    );


    profileContent.innerHTML =
      `
        <div class="private-label">
          🔒 Your likes are private.
        </div>

        <div class="empty">
          Unable to load liked posts.
        </div>
      `;

    return;

  }


  if (
    !likes ||
    likes.length === 0
  ) {

    profileContent.innerHTML =
      `
        <div class="private-label">
          🔒 Only you can see your liked content.
        </div>

        <div class="empty">
          You haven't liked any posts yet.
        </div>
      `;

    return;

  }


  const postIds =
    likes
      .map(
        like =>
          like.post_id
      )
      .filter(Boolean);


  if (
    postIds.length === 0
  ) {

    profileContent.innerHTML =
      `
        <div class="private-label">
          🔒 Only you can see your liked content.
        </div>
      `;

    return;

  }


  const {
    data: posts,
    error: postError
  } =
  await supabaseClient
    .from("posts")
    .select("*")
    .in(
      "id",
      postIds
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (postError) {

    console.error(
      "Liked posts error:",
      postError
    );


    profileContent.innerHTML =
      `
        <div class="empty">
          Unable to load liked posts.
        </div>
      `;

    return;

  }


  profileContent.innerHTML =
    `
      <div class="private-label">
        🔒 Only you can see the posts you have liked.
      </div>
    `;


  if (
    !posts ||
    posts.length === 0
  ) {

    profileContent.innerHTML +=
      `
        <div class="empty">
          Your liked posts are empty.
        </div>
      `;

    return;

  }


  posts.forEach(
    post => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "content-card";


      let media =
        "";


      /* =========================
         LIKED VIDEO
      ========================= */

      if (
        post.video_url
      ) {

        media =
          `
            <div class="content-media">

              <video
                src="${escapeAttribute(post.video_url)}"
                controls
                playsinline
                preload="metadata"
              ></video>

            </div>
          `;

      }


      /* =========================
         LIKED IMAGE
      ========================= */

      else if (
        post.image_url
      ) {

        media =
          `
            <div class="content-media">

              <img
                src="${escapeAttribute(post.image_url)}"
                alt="Liked post"
              >

            </div>
          `;

      }


      card.innerHTML =
        `
          <div class="content-date">
            ${formatDate(post.created_at)}
          </div>

          ${
            post.content
              ? `
                <div class="content-text">
                  ${escapeHTML(post.content)}
                </div>
              `
              : ""
          }

          ${media}
        `;


      profileContent.appendChild(
        card
      );

    }
  );

}


/* =========================================
   TABS
========================================= */

function activateTab(
  tab
) {

  postsTab.classList.remove(
    "active"
  );

  videosTab.classList.remove(
    "active"
  );

  likesTab.classList.remove(
    "active"
  );


  tab.classList.add(
    "active"
  );

}


postsTab.addEventListener(
  "click",
  async () => {

    activateTab(
      postsTab
    );

    await loadPosts();

  }
);


videosTab.addEventListener(
  "click",
  async () => {

    activateTab(
      videosTab
    );

    await loadVideos();

  }
);


likesTab.addEventListener(
  "click",
  async () => {

    activateTab(
      likesTab
    );

    await loadLikes();

  }
);


/* =========================================
   HELPERS
========================================= */

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


function escapeAttribute(
  text
) {

  return String(
    text || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


function formatDate(
  value
) {

  if (!value) {
    return "";
  }


  return new Date(
    value
  ).toLocaleString();

}


/* =========================================
   START
========================================= */

loadProfile();

</script>
